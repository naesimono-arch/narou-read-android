<!-- @dsCard group="UI-n / 読書設定（D詰め）" name="D. 和モダン・余白 — 表示設定シート（テーマ3択＝藍選択／文字サイズ／行間）" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI-n D 表示設定 — 和モダン余白</title>
<style>
  /* D案 読書設定: 読書画面から立ち上がるボトムシート（実機 ReadingSettingsSheet）。
     項目は実機能と1対1＝テーマ3択チップ／文字サイズ(14〜24sp)／行間(2.3〜2.8em)。
     選択中チップはDのアクセント藍で塗る。シート背景は読書テーマ背景に追従（ここではライト面）。
     ※スキン選択UIはこのシートに入れない（スキン機能は今回スコープ外）。 */
  :root{
    --bg:#FBFAF8;--ink:#1C1F26;--soft:#7C808B;--line:#ECEAE4;
    --ai:#1C3D5A;--seiji:#9CB3A8;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E4E3DD;display:flex;flex-direction:column;align-items:center;min-height:100vh;
    padding:26px;font-family:var(--gothic)}
  .cap{color:#5A5C57;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.6;max-width:640px}
  .cap b{color:#2A2C28}
  .phone{width:372px;height:780px;border-radius:40px;overflow:hidden;position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,.28);display:flex;flex-direction:column;
    background:linear-gradient(180deg,#F6F4F0,#EDEBE6)}
  /* 背後にうっすら本文（シートで暗転）。シートの文脈を示すだけの装飾 */
  .behind{position:absolute;inset:0;padding:60px 26px;font-family:var(--mincho);font-size:16px;
    line-height:2.4;color:#C9C6BF;text-indent:1em;overflow:hidden}
  .scrim{position:absolute;inset:0;background:rgba(20,23,28,.28)}
  /* ボトムシート */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;
    padding:10px 24px 30px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  .sheet h2{font-family:var(--mincho);font-size:17px;color:var(--ink);font-weight:600;letter-spacing:.08em;margin-bottom:20px}
  .lbl{font-family:var(--gothic);font-size:12px;color:var(--soft);letter-spacing:.06em;margin-bottom:10px}
  .sec{margin-bottom:24px}
  /* テーマ3択チップ。選択＝藍塗り＋白文字／非選択＝ヘアライン枠 */
  .chips{display:flex;gap:10px}
  .chip{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-family:var(--gothic);font-size:13.5px;
    border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer}
  .chip.on{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:600}
  /* スライダー（文字サイズ・行間）。両端ラベル＋トラック＋藍つまみ */
  .slider{display:flex;align-items:center;gap:14px}
  .end{font-family:var(--mincho);color:var(--ink);flex-shrink:0}
  .end.g{font-family:var(--gothic);font-size:12px;color:var(--soft)}
  .track{flex:1;height:2px;background:var(--line);position:relative;border-radius:2px}
  .track .fill{position:absolute;left:0;top:0;height:2px;background:var(--ai);border-radius:2px}
  .track .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ai);
    transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(28,61,90,.4)}
  .val{font-family:var(--gothic);font-size:12px;color:var(--ai);margin-left:8px}
  .row-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
</style>
</head>
<body>
  <p class="cap"><b>D. 和モダン・余白 — 表示設定</b> ／ 読書画面から立ち上がるボトムシート。テーマ3択（選択＝藍塗り）／文字サイズ 14〜24sp／行間 2.3〜2.8em。明朝見出し・ゴシックラベル・ヘアライン体系を踏襲。</p>
  <div class="phone" role="img" aria-label="D案 表示設定シート">
    <div class="behind">辺境の城門に辿り着いたのは、長い雨がようやく上がった頃だった。濡れた石畳が夕陽を照り返し、橙の光が水たまりに滲んでいる。彼女はそう呟くと、腰の剣をそっと地に置いた。もう戦う理由はない、とでも言うように。</div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="grab"></div>
      <h2>表示設定</h2>

      <div class="sec">
        <div class="lbl">テーマ</div>
        <div class="chips">
          <button class="chip on">ライト</button>
          <button class="chip">セピア</button>
          <button class="chip">ダーク</button>
        </div>
      </div>

      <div class="sec">
        <div class="row-lbl"><span class="lbl" style="margin:0">文字サイズ</span><span class="val">18sp</span></div>
        <div class="slider">
          <span class="end" style="font-size:14px">あ</span>
          <span class="track"><span class="fill" style="width:40%"></span><span class="knob" style="left:40%"></span></span>
          <span class="end" style="font-size:24px">あ</span>
        </div>
      </div>

      <div class="sec">
        <div class="row-lbl"><span class="lbl" style="margin:0">行間</span><span class="val">2.5</span></div>
        <div class="slider">
          <span class="end g">狭</span>
          <span class="track"><span class="fill" style="width:40%"></span><span class="knob" style="left:40%"></span></span>
          <span class="end g">広</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
