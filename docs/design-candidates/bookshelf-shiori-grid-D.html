<style>
  /* /design 採用案「型B 栞」＝天から色の細棒。その先端に、31種のワンポイント意匠から

<body>
  <p class="cap"><b>本棚 書架（グリッド）× 栞・最終形</b>　棒の先端に <b>31種</b>のワンポイントから種で1つを選ぶ（色相・長さ・x・先端すべて title 由来＝同じ本は同じ絵）。正本 fusion-D の実グリッド in-situ。下は先端の出方が見える生成レンジ。<b>先端は TIPS 配列に足すだけで拡張可</b>。</p>
  <div class="ctrl">
    <button class="primary" id="reroll">🎲 別の蔵書に差し替え</button>
    <button class="ghost" id="theme">◐ ライト / ダーク</button>

  <section class="range">
    <h2>生成レンジ（先端の出方）</h2>
    <p>同じ栞でも、タイトルで色相・長さ・先端が変わる＝蔵書が並ぶほど自分だけの書架に。</p>
    <div class="strip" id="strip"></div>
  </section>

<script>
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rand(rng,lo,hi){return lo+(hi-lo)*rng();}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}
const PALETTE=[20,70,140,175,200,210,260,330];
function coverHue(title){return pick(mulberry32(hashStr(title)),PALETTE);}
function hsl(h,s,l,a){return a==null?'hsl('+h+' '+s+'% '+l+'%)':'hsl('+h+' '+s+'% '+l+'% / '+a+')';}
function S(ctx,a){ctx.strokeStyle=a;ctx.lineCap='round';ctx.lineJoin='round';}
function star(ctx,cx,cy,rO,rI,n,rot){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?rI:rO,ang=rot+i*Math.PI/n;const px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}

// ===== 先端ワンポイント 174種（"都度増やす"＝ここと正本 shiori-tips-D.html と Kotlin SHIORI_TIPS へ同順で1行足す）。draw(c,x,ty,a,dark,paper) =====
const TIPS=[
  (c,x,y,a)=>{S(c,a);c.lineWidth=2.6;c.beginPath();c.moveTo(x,y);c.lineTo(x-6,y+12);c.moveTo(x,y);c.lineTo(x+6,y+12);c.stroke();}, // 0 魚尾
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+7,4,0,7);c.fill();}, // 1 一粒
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+6,6,0,7);c.fill();}, // 2 結び玉
  (c,x,y,a)=>{S(c,a);c.lineWidth=2.4;c.beginPath();c.moveTo(x,y);c.lineTo(x-5,y+18);c.moveTo(x,y);c.lineTo(x+5,y+18);c.stroke();}, // 3 二又房
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+3,3.2,0,7);c.fill();S(c,a);c.lineWidth=2;c.beginPath();c.moveTo(x,y+5);c.lineTo(x-6,y+22);c.moveTo(x,y+5);c.lineTo(x,y+23);c.moveTo(x,y+5);c.lineTo(x+6,y+22);c.stroke();}, // 4 三又房
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+4,4,0,7);c.fill();S(c,a);c.lineWidth=1.6;for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(x,y+7);c.lineTo(x+k*4,y+24);c.stroke();}}, // 5 総角
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y+4);c.quadraticCurveTo(x-11,y-2,x-9,y+4);c.quadraticCurveTo(x-11,y+10,x,y+4);c.moveTo(x,y+4);c.quadraticCurveTo(x+11,y-2,x+9,y+4);c.quadraticCurveTo(x+11,y+10,x,y+4);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+4,2,0,7);c.fill();}, // 6 蝶結び
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+5,4,0,7);c.fill();S(c,a);c.lineWidth=2;c.beginPath();c.moveTo(x,y+9);c.lineTo(x,y+20);c.stroke();}, // 7 玉と尾
  (c,x,y,a)=>{c.fillStyle=a;[6,13,20].forEach(d=>{c.beginPath();c.arc(x,y+d,2.6,0,7);c.fill();});}, // 8 数珠
  (c,x,y,a)=>{S(c,a);c.lineWidth=3;c.beginPath();c.moveTo(x-7,y+1);c.lineTo(x+7,y+1);c.stroke();}, // 9 括り
  (c,x,y,a)=>{S(c,a);c.lineWidth=2;c.beginPath();c.arc(x,y+7,5,0,7);c.stroke();}, // 10 小輪
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.arc(x,y+9,8,0,7);c.stroke();c.beginPath();c.arc(x,y+9,4,0,7);c.stroke();}, // 11 二重丸
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y+1);c.lineTo(x+6,y+9);c.lineTo(x,y+17);c.lineTo(x-6,y+9);c.closePath();c.stroke();}, // 12 菱
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x-7,y+1);c.lineTo(x+7,y+1);c.lineTo(x,y+13);c.closePath();c.stroke();}, // 13 逆三角
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.strokeRect(x-6,y+2,12,12);}, // 14 小四角
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;star(c,x,y+10,7,3,5,-Math.PI/2);c.stroke();}, // 15 星
  (c,x,y,a)=>{S(c,a);c.lineWidth=2;c.beginPath();c.moveTo(x,y+2);c.lineTo(x,y+16);c.moveTo(x-7,y+9);c.lineTo(x+7,y+9);c.stroke();}, // 16 十字
  (c,x,y,a)=>{c.fillStyle=a;[[0,5],[-5,13],[5,13]].forEach(p=>{c.beginPath();c.arc(x+p[0],y+p[1],2.2,0,7);c.fill();});}, // 17 三点
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+6,y+8,x,y+15);c.quadraticCurveTo(x-6,y+8,x,y);c.fill();}, // 18 雫
  (c,x,y,a,d,pp)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+9,7,0,7);c.fill();c.fillStyle=pp;c.beginPath();c.arc(x+3,y+7,7,0,7);c.fill();}, // 19 半月
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.moveTo(x-6,y+1);c.lineTo(x+6,y+1);c.lineTo(x,y+11);c.closePath();c.fill();}, // 20 矢尻
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.arc(x,y+9,6,-0.4,Math.PI*1.4);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x+4,y+5,2.4,0,7);c.fill();}, // 21 巴
  (c,x,y,a,d,pp)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+8,6,-0.2,Math.PI*1.5);c.quadraticCurveTo(x-3,y+13,x+1,y+10);c.closePath();c.fill();c.fillStyle=pp;c.beginPath();c.arc(x+2,y+5,1.6,0,7);c.fill();}, // 22 勾玉
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-6,y+11);c.quadraticCurveTo(x-6,y+1,x,y+1);c.quadraticCurveTo(x+6,y+1,x+6,y+11);c.closePath();c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+14,1.8,0,7);c.fill();}, // 23 鈴
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.arc(x,y+13,5,0,7);c.stroke();c.beginPath();c.arc(x,y+5,3.2,0,7);c.stroke();}, // 24 瓢箪
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+4);c.stroke();c.strokeRect(x-4,y+4,8,16);c.beginPath();c.arc(x,y+7,1,0,7);c.strokeStyle=a;c.stroke();}, // 25 短冊
  (c,x,y,a)=>{c.save();c.translate(x,y+9);c.rotate(0.06);S(c,a);c.lineWidth=1.4;c.strokeRect(-7,-7,14,14);c.fillStyle=a;c.beginPath();c.arc(0,0,1.8,0,7);c.fill();c.restore();}, // 26 蔵書印
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;for(let k=0;k<5;k++){const an=-Math.PI/2+k*2*Math.PI/5;c.beginPath();c.arc(x+6*Math.cos(an),y+9+6*Math.sin(an),3,0,7);c.stroke();}c.fillStyle=a;c.beginPath();c.arc(x,y+9,1.8,0,7);c.fill();}, // 27 梅
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+6,y+8,x,y+16);c.quadraticCurveTo(x-6,y+8,x,y);c.stroke();c.beginPath();c.moveTo(x,y+2);c.lineTo(x,y+14);c.stroke();}, // 28 木の葉
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+5);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+9,4,0,7);c.fill();}, // 29 木の実
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-6,y+2);c.quadraticCurveTo(x,y+7,x+6,y+2);c.quadraticCurveTo(x+1,y+9,x+6,y+16);c.quadraticCurveTo(x,y+11,x-6,y+16);c.quadraticCurveTo(x-1,y+9,x-6,y+2);c.closePath();c.stroke();}, // 30 分銅
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y+2);c.quadraticCurveTo(x-9,y+3,x-5,y+10);c.quadraticCurveTo(x-2,y+14,x+2,y+11);c.moveTo(x,y+2);c.quadraticCurveTo(x+9,y+3,x+5,y+10);c.quadraticCurveTo(x+2,y+14,x-2,y+11);c.stroke();c.beginPath();c.moveTo(x-2,y+12);c.lineTo(x-3,y+20);c.moveTo(x+2,y+12);c.lineTo(x+3,y+20);c.stroke();}, // 31 淡路結び
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+3,3,0,7);c.fill();S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y+5);c.lineTo(x-7,y+21);c.moveTo(x,y+5);c.lineTo(x-2,y+23);c.moveTo(x,y+5);c.lineTo(x+3,y+20);c.stroke();}, // 32 片流し房
  (c,x,y,a)=>{S(c,a);c.lineWidth=2.2;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+5,y+6,x,y+12);c.quadraticCurveTo(x-5,y+18,x,y+23);c.stroke();}, // 33 撚り房
  (c,x,y,a)=>{S(c,a);c.lineWidth=2.6;c.beginPath();c.moveTo(x-6,y+3);c.lineTo(x+6,y+3);c.moveTo(x-6,y+9);c.lineTo(x+6,y+9);c.stroke();}, // 34 二重括り
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+22);c.stroke();c.beginPath();c.moveTo(x-4,y+6);c.lineTo(x+4,y+9);c.moveTo(x-4,y+11);c.lineTo(x+4,y+14);c.stroke();}, // 35 巻き結び
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.arc(x,y+6,5,0,7);c.stroke();c.beginPath();c.moveTo(x,y+11);c.lineTo(x,y+23);c.stroke();}, // 36 輪結び
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.rect(x-4,y+2,8,4);c.fill();S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-3,y+6);c.lineTo(x-4,y+20);c.moveTo(x,y+6);c.lineTo(x,y+21);c.moveTo(x+3,y+6);c.lineTo(x+4,y+20);c.stroke();}, // 37 総締め
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();for(let k=0;k<6;k++){const an=-Math.PI/2+k*Math.PI/3,px=x+7*Math.cos(an),py=y+9+7*Math.sin(an);k?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.stroke();}, // 38 六角
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();for(let k=0;k<5;k++){const an=-Math.PI/2+k*2*Math.PI/5,px=x+7*Math.cos(an),py=y+8+7*Math.sin(an);k?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.stroke();}, // 39 五角

function drawTitle(ctx,text,w,h,ink){
  const fs=Math.round(w*0.088), lineGap=fs*1.16, colGap=Math.round(w*0.108), yTop=fs+5, yBottom=h-11, x0=w-fs-3, maxCols=3;
  const perCol=Math.floor((yBottom-yTop)/lineGap);
  ctx.fillStyle=ink; ctx.font='600 '+fs+'px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const chars=[...text];
  for(let col=0;col<maxCols;col++){const start=col*perCol;if(start>=chars.length)break;const cxp=x0-col*colGap;
    for(let i=0;i<perCol;i++){const idx=start+i;if(idx>=chars.length)break;let ch=chars[idx];
      if(col===maxCols-1&&i===perCol-1&&idx<chars.length-1)ch='⋮';
      ctx.fillText(ch,cxp,yTop+i*lineGap+lineGap/2);}}
}
function drawShiori(canvas,title,dark){
  const dpr=2, cssW=canvas.clientWidth||150, w=cssW, h=Math.round(w*1.5);
  canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const paper=dark?'#20232B':'#FBFAF8', ink=dark?'#ECE9E2':'#1C1F26';
  const hue=coverHue(title), accent=hsl(hue,48,dark?62:52);
  ctx.fillStyle=paper; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=dark?'rgba(255,255,255,.05)':'rgba(28,31,38,.05)'; ctx.lineWidth=1; ctx.strokeRect(.5,.5,w-1,h-1);
  const rng=mulberry32(hashStr(title+'|B'));
  const x=Math.round(rand(rng,0.14,0.36)*w)+.5, len=Math.round(rand(rng,0.30,0.60)*h);
  ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,len); ctx.stroke();
  TIPS[Math.floor(rng()*TIPS.length)](ctx,x,len,accent,dark,paper); // 先端＝種で1つ
  drawTitle(ctx,title,w,h,ink);
}
