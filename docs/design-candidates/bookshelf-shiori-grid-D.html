<script>
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rand(rng,lo,hi){return lo+(hi-lo)*rng();}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}
const PALETTE=[20,70,140,175,200,210,260,330];
function coverHue(title){return pick(mulberry32(hashStr(title)),PALETTE);}
function hsl(h,s,l,a){return a==null?'hsl('+h+' '+s+'% '+l+'%)':'hsl('+h+' '+s+'% '+l+'% / '+a+')';}
function S(ctx,a){ctx.strokeStyle=a;ctx.lineCap='round';ctx.lineJoin='round';}
function star(ctx,cx,cy,rO,rI,n,rot){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?rI:rO,ang=rot+i*Math.PI/n;const px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}

// ===== 先端ワンポイント 31種（"都度増やす"＝ここに1行足すだけ）。draw(c,x,ty,a,dark,paper) =====
const TIPS=[
  (c,x,y,a)=>{S(c,a);c.lineWidth=2.6;c.beginPath();c.moveTo(x,y);c.lineTo(x-6,y+12);c.moveTo(x,y);c.lineTo(x+6,y+12);c.stroke();},                                   // 魚尾
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+7,4,0,7);c.fill();},                                                                                               // 一粒
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+6,6,0,7);c.fill();},                                                                                               // 結び玉
  (c,x,y,a)=>{S(c,a);c.lineWidth=2.4;c.beginPath();c.moveTo(x,y);c.lineTo(x-5,y+18);c.moveTo(x,y);c.lineTo(x+5,y+18);c.stroke();},                                     // 二又房
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+3,3.2,0,7);c.fill();S(c,a);c.lineWidth=2;c.beginPath();c.moveTo(x,y+5);c.lineTo(x-6,y+22);c.moveTo(x,y+5);c.lineTo(x,y+23);c.moveTo(x,y+5);c.lineTo(x+6,y+22);c.stroke();}, // 三又房
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+4,4,0,7);c.fill();S(c,a);c.lineWidth=1.6;for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(x,y+7);c.lineTo(x+k*4,y+24);c.stroke();}}, // 総角(房)
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y+4);c.quadraticCurveTo(x-11,y-2,x-9,y+4);c.quadraticCurveTo(x-11,y+10,x,y+4);c.moveTo(x,y+4);c.quadraticCurveTo(x+11,y-2,x+9,y+4);c.quadraticCurveTo(x+11,y+10,x,y+4);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+4,2,0,7);c.fill();}, // 蝶結び
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+5,4,0,7);c.fill();S(c,a);c.lineWidth=2;c.beginPath();c.moveTo(x,y+9);c.lineTo(x,y+20);c.stroke();},                // 玉と尾
  (c,x,y,a)=>{c.fillStyle=a;[6,13,20].forEach(d=>{c.beginPath();c.arc(x,y+d,2.6,0,7);c.fill();});},                                                                    // 数珠
  (c,x,y,a)=>{S(c,a);c.lineWidth=3;c.beginPath();c.moveTo(x-7,y+1);c.lineTo(x+7,y+1);c.stroke();},                                                                     // 括り
  (c,x,y,a)=>{S(c,a);c.lineWidth=2;c.beginPath();c.arc(x,y+7,5,0,7);c.stroke();},                                                                                      // 小輪
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.arc(x,y+9,8,0,7);c.stroke();c.beginPath();c.arc(x,y+9,4,0,7);c.stroke();},                                        // 二重丸
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x,y+1);c.lineTo(x+6,y+9);c.lineTo(x,y+17);c.lineTo(x-6,y+9);c.closePath();c.stroke();},                    // 菱
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.moveTo(x-7,y+1);c.lineTo(x+7,y+1);c.lineTo(x,y+13);c.closePath();c.stroke();},                                    // 逆三角
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.strokeRect(x-6,y+2,12,12);},                                                                                                    // 小四角
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;star(c,x,y+10,7,3,5,-Math.PI/2);c.stroke();},                                                                                     // 星
  (c,x,y,a)=>{S(c,a);c.lineWidth=2;c.beginPath();c.moveTo(x,y+2);c.lineTo(x,y+16);c.moveTo(x-7,y+9);c.lineTo(x+7,y+9);c.stroke();},                                    // 十字
  (c,x,y,a)=>{c.fillStyle=a;[[0,5],[-5,13],[5,13]].forEach(p=>{c.beginPath();c.arc(x+p[0],y+p[1],2.2,0,7);c.fill();});},                                               // 三点
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+6,y+8,x,y+15);c.quadraticCurveTo(x-6,y+8,x,y);c.fill();},                                 // 雫
  (c,x,y,a,d,pp)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+9,7,0,7);c.fill();c.fillStyle=pp;c.beginPath();c.arc(x+3,y+7,7,0,7);c.fill();},                               // 半月
  (c,x,y,a)=>{c.fillStyle=a;c.beginPath();c.moveTo(x-6,y+1);c.lineTo(x+6,y+1);c.lineTo(x,y+11);c.closePath();c.fill();},                                               // 矢尻
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.8;c.beginPath();c.arc(x,y+9,6,-0.4,Math.PI*1.4);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x+4,y+5,2.4,0,7);c.fill();},           // 巴
  (c,x,y,a,d,pp)=>{c.fillStyle=a;c.beginPath();c.arc(x,y+8,6,-0.2,Math.PI*1.5);c.quadraticCurveTo(x-3,y+13,x+1,y+10);c.closePath();c.fill();c.fillStyle=pp;c.beginPath();c.arc(x+2,y+5,1.6,0,7);c.fill();}, // 勾玉
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-6,y+11);c.quadraticCurveTo(x-6,y+1,x,y+1);c.quadraticCurveTo(x+6,y+1,x+6,y+11);c.closePath();c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+14,1.8,0,7);c.fill();}, // 鈴
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.arc(x,y+13,5,0,7);c.stroke();c.beginPath();c.arc(x,y+5,3.2,0,7);c.stroke();},                                     // 瓢箪
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+4);c.stroke();c.strokeRect(x-4,y+4,8,16);c.beginPath();c.arc(x,y+7,1,0,7);c.stroke();},  // 短冊
  (c,x,y,a)=>{c.save();c.translate(x,y+9);c.rotate(0.06);S(c,a);c.lineWidth=1.4;c.strokeRect(-7,-7,14,14);c.fillStyle=a;c.beginPath();c.arc(0,0,1.8,0,7);c.fill();c.restore();}, // 蔵書印
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;for(let k=0;k<5;k++){const an=-Math.PI/2+k*2*Math.PI/5;c.beginPath();c.arc(x+6*Math.cos(an),y+9+6*Math.sin(an),3,0,7);c.stroke();}c.fillStyle=a;c.beginPath();c.arc(x,y+9,1.8,0,7);c.fill();}, // 梅
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+6,y+8,x,y+16);c.quadraticCurveTo(x-6,y+8,x,y);c.stroke();c.beginPath();c.moveTo(x,y+2);c.lineTo(x,y+14);c.stroke();}, // 木の葉
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+5);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+9,4,0,7);c.fill();},                 // 木の実
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-6,y+2);c.quadraticCurveTo(x,y+7,x+6,y+2);c.quadraticCurveTo(x+1,y+9,x+6,y+16);c.quadraticCurveTo(x,y+11,x-6,y+16);c.quadraticCurveTo(x-1,y+9,x-6,y+2);c.closePath();c.stroke();} // 分銅
];

function drawTitle(ctx,text,w,h,ink){
  const fs=Math.round(w*0.088), lineGap=fs*1.16, colGap=Math.round(w*0.108), yTop=fs+5, yBottom=h-11, x0=w-fs-3, maxCols=3;
  const perCol=Math.floor((yBottom-yTop)/lineGap);
  ctx.fillStyle=ink; ctx.font='600 '+fs+'px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const chars=[...text];
  for(let col=0;col<maxCols;col++){const start=col*perCol;if(start>=chars.length)break;const cxp=x0-col*colGap;
    for(let i=0;i<perCol;i++){const idx=start+i;if(idx>=chars.length)break;let ch=chars[idx];
      if(col===maxCols-1&&i===perCol-1&&idx<chars.length-1)ch='⋮';
      ctx.fillText(ch,cxp,yTop+i*lineGap+lineGap/2);}}
}
function drawShiori(canvas,title,dark){
  const dpr=2, cssW=canvas.clientWidth||150, w=cssW, h=Math.round(w*1.5);
  canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const paper=dark?'#20232B':'#FBFAF8', ink=dark?'#ECE9E2':'#1C1F26';
  const hue=coverHue(title), accent=hsl(hue,48,dark?62:52);
  ctx.fillStyle=paper; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=dark?'rgba(255,255,255,.05)':'rgba(28,31,38,.05)'; ctx.lineWidth=1; ctx.strokeRect(.5,.5,w-1,h-1);
  const rng=mulberry32(hashStr(title+'|B'));
  const x=Math.round(rand(rng,0.14,0.36)*w)+.5, len=Math.round(rand(rng,0.30,0.60)*h);
  ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,len); ctx.stroke();
  TIPS[Math.floor(rng()*TIPS.length)](ctx,x,len,accent,dark,paper); // 先端＝種で1つ
  drawTitle(ctx,title,w,h,ink);
}

  {t:'名もなき料理人、王宮を救う',a:'夜灯すばる',s:'short'},
  {t:'黄昏の魔法使いと約束の丘',a:'霧島あおい',s:'p:19'},
  {t:'鍛冶師の娘、剣より鍋を振るう',a:'青葉みのり',s:'p:88'}
];
function statusHTML(s){
  const p=s.split(':');
  if(p[0]==='p'){let h='<div class="pr"><div class="bar"><i style="width:'+p[1]+'%"></i></div><span class="pct">'+p[1]+'%</span></div>';if(p[2])h+='<div class="nc"><span class="dot"></span><span class="t">続き '+p[2]+'話</span></div>';return h;}
  if(s==='done')return '<div class="pr"><div class="bar"><i style="width:100%"></i></div><span class="pct">100%</span></div>';
  if(s==='untaken')return '<div class="mr">なろう・未取込</div>';
  return '<div class="sr">短編・未読</div>';
}
function phone(dark,list){
  const acts='<div class="acts"><button class="ib"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button><button class="ib"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button><button class="ib"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div>';
  const guide='<div class="find-guide"><svg viewBox="0 0 24 24" class="fi"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><span class="txt">新しい物語を見つける</span><svg viewBox="0 0 24 24" class="ar"><polyline points="9 18 15 12 9 6"/></svg></div>';
  const cards=list.map(it=>{
    const seal=(it.s==='done')?'<span class="seal">了</span>':'';
    return '<div class="bk"><div class="cv" data-dark="'+(dark?1:0)+'"><canvas data-t="'+encodeURIComponent(it.t)+'"></canvas>'+seal+'</div><div class="au">'+it.a+'</div>'+statusHTML(it.s)+'</div>';
  }).join('');
  return '<div class="wrap"><span class="mode">'+(dark?'ダーク':'ライト')+'</span><div class="phone'+(dark?' dark':'')+'"><div class="sb"><span>9:41</span><span>●●● 84%</span></div><div class="top"><h1>本棚</h1>'+acts+'</div><div class="scroll">'+guide+'<div class="grid-shelf">'+cards+'</div></div></div></div>';
}
let dark=false, list=POOL.slice(0,6);
function paintAll(){document.querySelectorAll('canvas[data-t]').forEach(cv=>{const t=decodeURIComponent(cv.dataset.t), d=(cv.closest('[data-dark]')?cv.parentElement.dataset.dark==='1':dark);drawShiori(cv,t,d);});}
function renderStage(){document.getElementById('stage').innerHTML=phone(false,list)+phone(true,list);}
function renderStrip(){document.getElementById('strip').innerHTML=POOL.map(it=>'<div class="rc"><div class="cv" data-dark="'+(dark?1:0)+'"><canvas data-t="'+encodeURIComponent(it.t)+'"></canvas></div><div class="ct">'+it.t+'</div></div>').join('');}
function all(){renderStage();renderStrip();requestAnimationFrame(paintAll);}
function sample(arr,n){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a.slice(0,n);}
all();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paintAll);
document.getElementById('reroll').addEventListener('click',()=>{list=sample(POOL,6);all();});
document.getElementById('theme').addEventListener('click',()=>{dark=!dark;document.body.classList.toggle('pgdark',dark);all();});
</script>
