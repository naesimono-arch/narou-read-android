<script>
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rand(rng,lo,hi){return lo+(hi-lo)*rng();}
const PALETTE=[20,70,140,175,200,210,260,330];
function coverHue(title){const rng=mulberry32(hashStr(title));return PALETTE[Math.floor(rng()*PALETTE.length)];}
function hsl(h,s,l){return 'hsl('+h+' '+s+'% '+l+'%)';}
function S(ctx,a){ctx.strokeStyle=a;ctx.lineCap='round';ctx.lineJoin='round';}
function star(ctx,cx,cy,rO,rI,n,rot){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?rI:rO,ang=rot+i*Math.PI/n;const px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}

  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-6,y+11);c.quadraticCurveTo(x-6,y+1,x,y+1);c.quadraticCurveTo(x+6,y+1,x+6,y+11);c.closePath();c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+14,1.8,0,7);c.fill();},

  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;for(let k=0;k<5;k++){const an=-Math.PI/2+k*2*Math.PI/5;c.beginPath();c.arc(x+6*Math.cos(an),y+9+6*Math.sin(an),3,0,7);c.stroke();}c.fillStyle=a;c.beginPath();c.arc(x,y+9,1.8,0,7);c.fill();},
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+6,y+8,x,y+16);c.quadraticCurveTo(x-6,y+8,x,y);c.stroke();c.beginPath();c.moveTo(x,y+2);c.lineTo(x,y+14);c.stroke();},
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+5);c.stroke();c.fillStyle=a;c.beginPath();c.arc(x,y+9,4,0,7);c.fill();},
  (c,x,y,a)=>{S(c,a);c.lineWidth=1.6;c.beginPath();c.moveTo(x-6,y+2);c.quadraticCurveTo(x,y+7,x+6,y+2);c.quadraticCurveTo(x+1,y+9,x+6,y+16);c.quadraticCurveTo(x,y+11,x-6,y+16);c.quadraticCurveTo(x-1,y+9,x-6,y+2);c.closePath();c.stroke();}

function drawTitle(ctx,text,w,h,ink){
  const fs=Math.round(w*0.088), lineGap=fs*1.16, colGap=Math.round(w*0.108), yTop=fs+5, yBottom=h-11, x0=w-fs-3, maxCols=3;
  const perCol=Math.floor((yBottom-yTop)/lineGap);
  ctx.fillStyle=ink; ctx.font='600 '+fs+'px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const chars=[...text];
  for(let col=0;col<maxCols;col++){const start=col*perCol;if(start>=chars.length)break;const cxp=x0-col*colGap;
    for(let i=0;i<perCol;i++){const idx=start+i;if(idx>=chars.length)break;let ch=chars[idx];
      if(col===maxCols-1&&i===perCol-1&&idx<chars.length-1)ch='⋮';
      ctx.fillText(ch,cxp,yTop+i*lineGap+lineGap/2);}}
}
function drawShiori(canvas,title){
  const dpr=2, w=canvas.clientWidth||150, h=Math.round(w*1.5);
  canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const paper='#FBFAF8', ink='#1C1F26';
  const hue=coverHue(title), accent=hsl(hue,48,52);
  ctx.fillStyle=paper; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(28,31,38,.05)'; ctx.lineWidth=1; ctx.strokeRect(.5,.5,w-1,h-1);
  const rng=mulberry32(hashStr(title+'|B'));
  const x=Math.round(rand(rng,0.14,0.36)*w)+.5, len=Math.round(rand(rng,0.30,0.60)*h);
  ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,len); ctx.stroke();
  TIPS[Math.floor(rng()*TIPS.length)](ctx,x,len,accent,false,paper);
  drawTitle(ctx,title,w,h,ink);
}

function statusHTML(s){
  const p=s.split(':');
  if(p[0]==='p'){let h='<div class="pr"><div class="bar"><i style="width:'+p[1]+'%"></i></div><span class="pct">'+p[1]+'%</span></div>';if(p[2])h+='<div class="nc"><span class="dot"></span><span class="t">続き '+p[2]+'話</span></div>';return h;}
  if(s==='done')return '<div class="pr"><div class="bar"><i style="width:100%"></i></div><span class="pct">100%</span></div>';
  if(s==='untaken')return '<div class="mr">なろう・未取込</div>';
  return '<div class="sr">短編・未読</div>';
}
function cardsHTML(){
  return POOL.map((it,idx)=>{
    const seal=(it.s==='done')?'<span class="seal">了</span>':'';
    const mk=(idx===0)?'<div class="marker" style="top:-6px"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>先頭本</div>':'';
    return mk+'<div class="bk"><div class="cv"><canvas data-t="'+encodeURIComponent(it.t)+'"></canvas>'+seal+'</div><div class="au">'+it.a+'</div>'+statusHTML(it.s)+'</div>';
  }).join('');
}
const ACTS='<div class="acts"><button class="ib" aria-label="見つける"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button><button class="ib" aria-label="リスト"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg></button><button class="ib" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div>';
const FIND='<svg viewBox="0 0 24 24" class="fi"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';
const FILTERS='<div class="filters"><span class="fchip on">すべて</span><span class="fchip">よみかけ</span><span class="fchip">未読</span><span class="fchip">読了</span></div>';
function head(mode){
  if(mode==='now')return '<div class="find-guide">'+FIND+'<span class="txt">新しい物語を見つける</span><svg viewBox="0 0 24 24" class="ar"><polyline points="9 18 15 12 9 6"/></svg></div>'+FILTERS;
  if(mode==='A')return '<div class="merge-row"><span class="find-pill"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>見つける</span><span class="divider-v"></span><span class="fchip on">すべて</span><span class="fchip">よみかけ</span><span class="fchip">未読</span><span class="fchip">読了</span></div>';
  if(mode==='B')return '<div class="sticky-strip"><div class="find-collapsed"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><span class="grow">新しい物語を見つける</span><svg viewBox="0 0 24 24" style="stroke:var(--ink-soft)"><polyline points="9 18 15 12 9 6"/></svg></div>'+FILTERS+'</div>';
  if(mode==='C')return FILTERS;
}
function grid(mode){
  let extra='';
  if(mode==='C')extra='<div class="bk find-tile"><div class="cv"><div class="plus"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>見つける</span></div></div><div class="au">新しい物語を</div></div>';
  return '<div class="grid-shelf" style="position:relative">'+cardsHTML()+extra+'</div>';
}
const FRAMES=[
  {mode:'now',t:'現状（参照）',s:'帯（箱・下余白20px）＋フィルタ行の<b>2ブロック</b>が先頭を占有。読みかけ本がほぼ1画面沈む。帯は上端🔍と重複。'},
  {mode:'A',t:'案A ／ 一行融合',s:'帯を左端の<b>藍ピル</b>に縮めフィルタと<b>同一行</b>へ。縦1行回収・明示導線を保つ。'},
  {mode:'B',t:'案B ／ スクロール退避',s:'先頭のみ帯フル、下スクロールで<b>帯畳み・フィルタ sticky</b>。図は少しスクロール後。'},
  {mode:'C',t:'案C ／ 末尾タイル',s:'帯を先頭から外し<b>グリッド末尾に発見タイル</b>。先頭を完全に蔵書へ。移設＝撤去でない。'}
];
document.getElementById('stage').innerHTML=FRAMES.map(f=>
  '<div class="wrap"><span class="mode">'+f.t+'</span><span class="sub">'+f.s+'</span>'+
  '<div class="phone"><div class="sb"><span>9:41</span><span>●●● 84%</span></div>'+
  '<div class="top"><h1>本棚</h1>'+ACTS+'</div><div class="scroll">'+head(f.mode)+grid(f.mode)+'</div></div></div>'
).join('');
function paintAll(){document.querySelectorAll('canvas[data-t]').forEach(cv=>drawShiori(cv,decodeURIComponent(cv.dataset.t)));}
requestAnimationFrame(paintAll);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paintAll);
</script>
</body>
</html>
