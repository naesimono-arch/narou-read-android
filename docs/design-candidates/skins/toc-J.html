<!-- @dsCard group="UI-n / K形伝播ドラフト（スキンJ）" name="J×K形. 目次 — 世界の廊下に明快Kの形（作品名サブ・現在地チップ・ここから再開・既読✓／ナビ無し）" -->
<!--
  K形伝播ドラフト（toc-J）。K plan の確定事項5に従う（目次は深い画面＝ボトムナビ無し）。
  ・伝播する「形」= 明示タイトル「目次」＋作品名サブ・現在地チップ「いま読んでいる: 第N話」＋読了率・
    現在章の唯一の実アクション「ここから再開」・既読は行末に✓。
  ・温存する意匠 = Jの"廊下を進む道程"＝左に一本の道(rail)を通し章を道沿いの節目(node)に。
    歩いた章＝道が金に灯り節目が埋まる／現在章＝いま立つ扉＝金の左ルール＋淡い金面＋明朝太字＋金文字＋大気の灯り／
    まだ先の章＝道が細く沈み節目は空。いま居る世界の大気＋象徴文字(希薄)。署名色=金1系統。
  ・変更点(K形): Jに無かった作品名サブ／現在地チップ＋読了率／現在章の「ここから再開」アクション／既読✓ を追加。
  単一画面・ダークのみ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J×K形 目次 — 世界の廊下に明快の形</title>
<style>
  :root{
    --page:#0F1712; --ink:#E7ECE1; --soft:rgba(233,240,228,.52); --dim:rgba(233,240,228,.34);
    --line:rgba(233,240,228,.09); --gold:#E2C878; --goldd:rgba(226,200,120,.5);
    --gold-tint:rgba(226,200,120,.12);
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070806;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;font-family:var(--gothic);-webkit-font-smoothing:antialiased}

  .phone{width:390px;height:844px;background:var(--page);border-radius:42px;overflow:hidden;position:relative;
    box-shadow:0 26px 64px rgba(0,0,0,.7);display:flex;flex-direction:column}
  /* いま居る世界の大気＋象徴文字（J温存・希薄化） */
  .phone::before{content:"";position:absolute;left:0;right:0;top:0;height:220px;z-index:0;pointer-events:none;
    background:radial-gradient(90% 70% at 50% -6%,rgba(214,196,120,.10),transparent 58%),
              radial-gradient(120% 80% at 50% -16%,rgba(39,64,48,.5),transparent 60%)}
  .glyph{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:0;pointer-events:none;
    font-family:var(--mincho);font-size:150px;line-height:1;color:rgba(233,240,228,.05)}

  .sb{position:relative;z-index:2;height:34px;flex-shrink:0;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;font-size:11px;color:var(--soft)}

  /* ヘッダ: ←戻る＋「目次」＋作品名サブ（K形。作品名サブはJに無かったので追加） */
  .top{position:relative;z-index:2;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:2px 12px 12px;
    border-bottom:1px solid var(--line)}
  .back{width:42px;height:42px;flex-shrink:0;border:none;background:transparent;border-radius:11px;
    display:grid;place-items:center;color:var(--ink);cursor:pointer}
  .back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
  .htxt{min-width:0}
  .htxt h1{font-family:var(--mincho);font-size:19px;color:var(--ink);font-weight:500;letter-spacing:.14em;line-height:1.2}
  .htxt .work{font-family:var(--mincho);font-size:12.5px;color:var(--soft);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 現在地バー: 現在話チップ（淡い金地・金字）＋読了率（K形。Jに無かったので追加） */
  .here{position:relative;z-index:2;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:14px 18px 12px}
  .herechip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-tint);color:var(--gold);
    font-family:var(--gothic);font-size:12px;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer;
    border:1px solid rgba(226,200,120,.28)}
  .prog{font-size:11.5px;color:var(--soft);flex-shrink:0}

  .scroll{position:relative;z-index:2;flex:1;overflow:auto}

  /* 章行＝道沿いの節目。左48pxが「道」の列（縦線＋node）、右が明朝の章題（J温存） */
  .li{position:relative;display:flex;align-items:stretch;cursor:pointer}
  .rail{width:48px;flex-shrink:0;position:relative}
  .rail::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--line)} /* 未踏の道＝細く沈む */
  .li.passed .rail::before,.li.cur .rail::before{background:var(--goldd)}                               /* 歩いた道＝金に灯る */
  .node{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;
    border:2px solid var(--line);background:var(--page);z-index:1}
  .li.passed .node{background:var(--goldd);border-color:var(--goldd)}                                    /* 通過済み＝埋まる */
  .li.cur .node{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px rgba(226,200,120,.16)}/* 現在＝灯る */

  /* 章題ブロック: 話数(ゴシックsoft)＋章題(明朝)。行末に状態表現（✓/ここから再開） */
  .tx{flex:1;min-width:0;display:flex;align-items:center;gap:12px;
    padding:16px 18px 16px 2px;border-bottom:1px solid var(--line)}
  .tx .ep{font-family:var(--gothic);font-size:11px;color:var(--soft);width:52px;flex-shrink:0;letter-spacing:.02em}
  .tx .ti{flex:1;min-width:0;font-family:var(--mincho);font-size:15px;color:var(--ink);line-height:1.55;font-weight:400}
  .tx .end{flex-shrink:0;display:flex;align-items:center}
  .tx .end svg{width:16px;height:16px;stroke:var(--goldd);fill:none;stroke-width:2}
  /* 既読: 章題を静かに沈め、行末に✓（K形の既読✓／道はJ金で灯ったまま） */
  .li.passed .tx .ti{color:var(--dim)}
  /* 現在章＝いま立つ扉。淡い金面＋明朝太字＋金文字＋大気の灯り（J温存）＋唯一の実アクション「ここから再開」（K形） */
  .li.cur{background:radial-gradient(120% 140% at 8% 50%,rgba(226,200,120,.12),transparent 60%),rgba(226,200,120,.06)}
  .li.cur .tx .ti{color:var(--gold);font-weight:700}
  .li.cur .resume{font-family:var(--gothic);font-size:11px;font-weight:700;color:#15241A;background:var(--gold);
    border-radius:999px;padding:6px 12px;white-space:nowrap}
</style>
</head>
<body>
  <div class="phone" role="img" aria-label="J×K形 目次">
    <div class="glyph" aria-hidden="true">薬</div>
    <div class="sb"><span>9:41</span><span>●●● 84%</span></div>

    <!-- ヘッダ: 目次＋作品名サブ -->
    <div class="top">
      <button class="back" aria-label="本棚に戻る"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="htxt">
        <h1>目次</h1>
        <div class="work">追放された万能薬師、辺境でスローライフを始める</div>
      </div>
    </div>

    <!-- 現在地バー -->
    <div class="here">
      <span class="herechip">いま読んでいる: 第127話</span>
      <span class="prog">全132話・読了率96%</span>
    </div>

    <div class="scroll">
      <div class="li passed"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第124話</span><span class="ti">遠雷、辺境の街道を行く</span><span class="end"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span></span></div>
      <div class="li passed"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第125話</span><span class="ti">古い井戸と、忘れられた約束</span><span class="end"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span></span></div>
      <div class="li passed"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第126話</span><span class="ti">夜営の火、語られぬ過去のこと</span><span class="end"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span></span></div>
      <div class="li cur"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第127話</span><span class="ti">雨上がりの城門にて、彼女は静かに剣を置いた</span><span class="end"><span class="resume">ここから再開</span></span></span></div>
      <div class="li"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第128話</span><span class="ti">市場のざわめきと、薬草の値段</span><span class="end"></span></span></div>
      <div class="li"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第129話</span><span class="ti">領主の館へ、招かれざる客として</span><span class="end"></span></span></div>
      <div class="li"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第130話</span><span class="ti">長い夜の終わりに交わした言葉</span><span class="end"></span></span></div>
      <div class="li"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第131話</span><span class="ti">旅立ちの朝、薬箱を背負って</span><span class="end"></span></span></div>
      <div class="li"><span class="rail"><span class="node"></span></span>
        <span class="tx"><span class="ep">第132話</span><span class="ti">峠の茶屋、見知らぬ剣士との出会い</span><span class="end"></span></span></div>
    </div>
  </div>
</body>
</html>
