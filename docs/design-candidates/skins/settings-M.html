<!-- @dsCard group="UI-n / 読書設定（スキン候補）" name="M. 星図 — 表示設定シート（観測パネル・星のつまみ・夜天は夜の相で固定）" -->
<!--
  思想の翻訳: 読書画面から立ち上がる観測パネル。夜天の上にせり上がる暗いシート。D表示設定の機能（テーマ／文字サイズ／行間）をMトークンへ写像。
  遊びを足した所: シート上に露出する夜空を星屑で満たし、見出しに小さな星座片、つまみ＝きらめく星（sparkle）、伸びる帯＝結線。
  D正本との差（省略でなくスキンの本性・ADR0021）: 星図は「夜の相」の単一変種（C夜行と同型）。テーマ3択は無意味化するため畳み、変種切替は本棚の「装いの間」へ移管する旨を明示（機能は消さず所在を示す）。
  規格層は不変: 意味を運ぶ文字は4.5:1以上・和文letterSpacing 0。
  ※ 3系統: 群青の夜天／星光の金（選択・つまみ・値）／月光スレート（線・トラック・補助文字）。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI-n M 表示設定 — 星図</title>
<style>
  :root{
    --text:#DCE3F2;--dim:#8791AD;--star:#E9DDB4;
    --line:rgba(150,168,214,.22);
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#06080F;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:26px;font-family:var(--gothic)}
  .cap{color:#7C86A2;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.7;max-width:640px}
  .cap b{color:#DCE3F2}

  .phone{width:390px;height:844px;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    box-shadow:0 30px 72px rgba(0,0,0,.72);font-family:var(--mincho);
    background:
      radial-gradient(80% 34% at 66% 3%,rgba(66,86,158,.24),transparent 60%),
      linear-gradient(178deg,#0B1330 0%,#0D1636 48%,#080E26 100%);}
  .skybg{position:absolute;inset:0;z-index:0}
  /* 背後にうっすら本文（夜天の上・シートで沈む） */
  .behind{position:absolute;inset:0;z-index:1;padding:64px 28px;font-size:16px;line-height:2.5;color:#2B3556;text-indent:1em;overflow:hidden}
  .scrim{position:absolute;inset:0;z-index:2;background:rgba(6,9,18,.42)}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;border-radius:22px 22px 0 0;padding:14px 26px 36px;
    background:linear-gradient(180deg,#182034,#111726);border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(0,0,0,.5)}
  .grab{width:38px;height:4px;border-radius:2px;background:rgba(150,168,214,.35);margin:0 auto 22px}
  .sheet h2{font-family:var(--mincho);font-size:18px;color:var(--text);font-weight:600;letter-spacing:.08em;display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .scope-note{font-family:var(--gothic);font-size:11px;color:var(--dim);letter-spacing:.03em;line-height:1.5;margin-bottom:32px}
  .lbl{font-family:var(--gothic);font-size:12px;color:var(--dim);letter-spacing:.06em}
  .sec{margin-bottom:32px}
  .row-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .val{font-family:var(--gothic);font-size:12px;color:var(--star)}

  .theme-fixed{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .theme-fixed .st{width:6px;height:6px;border-radius:50%;background:var(--star);box-shadow:0 0 7px rgba(233,221,180,.7);flex-shrink:0}
  .theme-fixed .tf-b{font-family:var(--mincho);font-size:13.5px;color:var(--text)}
  .theme-fixed .tf-s{font-family:var(--gothic);font-size:10.5px;color:var(--dim);margin-top:4px;letter-spacing:.02em}

  .slider{display:flex;align-items:center;gap:18px}
  .end{color:var(--text);flex-shrink:0}
  .end.g{font-family:var(--gothic);font-size:12px;color:var(--dim)}
  .track{flex:1;height:2px;background:rgba(150,168,214,.25);position:relative;border-radius:2px}
  .track .fill{position:absolute;left:0;top:0;height:2px;background:var(--star);border-radius:2px;box-shadow:0 0 5px rgba(233,221,180,.5)}
  /* つまみ＝きらめく星（芯＋4方向の光条） */
  .track .knob{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%)}
  .track .knob::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#F7F3E1;box-shadow:0 0 12px rgba(233,221,180,.9)}
  .track .knob::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);
    background:
      linear-gradient(0deg,transparent 46%,rgba(233,221,180,.85) 50%,transparent 54%),
      linear-gradient(90deg,transparent 46%,rgba(233,221,180,.85) 50%,transparent 54%)}
</style>
</head>
<body>
  <p class="cap"><b>M. 星図 — 表示設定</b> ／ 夜天からせり上がる観測パネル。露出した夜空を星屑で満たし、見出しに星座片、つまみ＝きらめく星・帯＝結線。テーマは「夜の相」で固定（3択は畳み、変種切替は本棚の装いの間へ）。</p>
  <div class="phone" role="img" aria-label="M案 表示設定シート">
    <canvas class="skybg" aria-hidden="true"></canvas>
    <div class="behind">辺境の城門に辿り着いたのは、長い雨がようやく上がった頃だった。濡れた石畳が夕陽を照り返し、橙の光が水たまりに滲んでいる。彼女はそう呟くと、腰の剣をそっと地に置いた。</div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="grab"></div>
      <h2><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><g stroke="rgba(233,221,180,.6)" stroke-width="1" fill="none"><line x1="3" y1="11" x2="10" y2="5"/><line x1="10" y1="5" x2="19" y2="9"/></g><g fill="#E9DDB4"><circle cx="3" cy="11" r="1.3"/><circle cx="10" cy="5" r="1.9"/><circle cx="19" cy="9" r="1.3"/></g></svg>表示設定</h2>
      <p class="scope-note">配色や文字の設定は、すべての本に適用されます</p>

      <div class="sec">
        <div class="lbl" style="margin-bottom:12px">テーマ</div>
        <div class="theme-fixed">
          <span class="st"></span>
          <div><div class="tf-b">星図 ・ 夜の相</div>
          <div class="tf-s">ほかの装いは本棚の「装いの間」から</div></div>
        </div>
      </div>

      <div class="sec">
        <div class="row-lbl"><span class="lbl">文字サイズ</span><span class="val">18sp</span></div>
        <div class="slider">
          <span class="end" style="font-size:14px">あ</span>
          <span class="track"><span class="fill" style="width:40%"></span><span class="knob" style="left:40%"></span></span>
          <span class="end" style="font-size:24px">あ</span>
        </div>
      </div>

      <div class="sec" style="margin-bottom:8px">
        <div class="row-lbl"><span class="lbl">行間</span><span class="val">2.5</span></div>
        <div class="slider">
          <span class="end g">狭</span>
          <span class="track"><span class="fill" style="width:40%"></span><span class="knob" style="left:40%"></span></span>
          <span class="end g">広</span>
        </div>
      </div>
    </div>
  </div>

<script>
// シート上に露出する夜空を星屑で満たす（上部45%。シートで覆う下部は描かない）
(function(){
  const W=390,H=844,dpr=Math.max(1,window.devicePixelRatio||1);
  const cv=document.querySelector('.skybg');const ctx=cv.getContext('2d');
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.scale(dpr,dpr);
  let seed=24680;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<70;i++){const x=rnd()*W,y=44+rnd()*360,r=rnd()*1+.3,a=rnd()*.4+.06;
    ctx.fillStyle='rgba(214,224,250,'+a+')';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
  // 数点だけ明るい星（glow）
  [[70,110,.5],[300,90,.55],[200,160,.45],[120,220,.4]].forEach(([x,y,a])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,5);g.addColorStop(0,'rgba(233,221,180,'+a+')');g.addColorStop(1,'rgba(233,221,180,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
    ctx.fillStyle='rgba(245,248,255,'+(a+.2)+')';ctx.beginPath();ctx.arc(x,y,1.3,0,7);ctx.fill();});
})();
</script>
</body>
</html>
