<!-- @dsCard group="UI-n / K形伝播ドラフト（星図M）" name="M×K形. 設定 — 星図（節構成＋恒常ナビ・ドラフト）" -->
<!--
  K形状伝播ドラフト（2026-07-23）: 明快Kの「形」（節構成の設定画面＋恒常ボトムナビ）を星図Mの意匠で再構成。
  ・形（K由来）: 明示タイトル「設定」・グループ化リスト＋説明文・節構成〈テーマ／きせかえ／新着話通知＋説明文／(debug)診断／アプリ情報〉・恒常ボトムナビ3タブ。
  ・意匠（M温存）: 群青の夜天グラデ地／星屑canvas／温白の星光(--star)＝選択・トグルON・テーマの相／月光スレート(--dim,--line)＝線・補助文字。mincho=見出し/相名・gothic=UIラベル。
  ・ボトムナビ骨格は bookshelf-K.html:229-248 をマークアップ・SVG・ラベルごと固定コピーし、色のみ M トークンへ差替。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M×K形 設定 — 星図</title>
<style>
  :root{
    --text:#DCE3F2;--dim:#8791AD;--star:#E9DDB4;
    --line:rgba(150,168,214,.20);
    --card:rgba(14,22,52,.42);   /* 夜天上の観測票カード地（濃色ダミーでなく夜天と同系の透過） */
    --navbg:#0A1128;             /* 固定クロームの夜天ソリッド */
    --star-tint:rgba(233,221,180,.14); /* 選択ピル/トグルON帯 */
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#06080F;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:26px;font-family:var(--gothic);-webkit-font-smoothing:antialiased}
  .cap{color:#7C86A2;font-size:13px;margin-bottom:16px;text-align:center;line-height:1.7;max-width:560px}
  .cap b{color:#DCE3F2}

  .phone{width:390px;height:844px;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    box-shadow:0 30px 72px rgba(0,0,0,.72);
    background:
      radial-gradient(80% 34% at 66% 3%,rgba(66,86,158,.24),transparent 60%),
      linear-gradient(178deg,#0B1330 0%,#0D1636 48%,#080E26 100%);}
  .skybg{position:absolute;inset:0;z-index:0;pointer-events:none}
  .layer{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

  .sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;color:#6E7794}

  /* ヘッダ: 明示タイトル「設定」（mincho・字間＝Mの銘の作法） */
  .head{flex-shrink:0;padding:4px 22px 14px}
  .head h1{font-family:var(--mincho);font-size:22px;color:var(--text);font-weight:500;letter-spacing:.18em}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 22px 24px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* 節見出し（K形の節構成・月光スレート字） */
  .gh{font-size:11px;color:var(--dim);letter-spacing:.22em;margin:22px 4px 9px;font-family:var(--gothic)}
  .gh:first-child{margin-top:6px}

  /* グループ＝夜天上の観測票カード（ヘアライン枠・行はヘアライン区切り） */
  .group{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .ri{width:24px;height:24px;flex-shrink:0;color:var(--dim)}
  .ri svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .rt{flex:1;min-width:0}
  .rl{font-family:var(--gothic);font-size:15px;color:var(--text);letter-spacing:.02em}
  .rd{font-size:12px;color:var(--dim);line-height:1.5;margin-top:4px;letter-spacing:.01em}
  .rr{flex-shrink:0;display:flex;align-items:center;gap:8px}
  .rv{font-family:var(--gothic);font-size:13px;color:var(--dim);letter-spacing:.02em}
  .chev{width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .row.disabled{opacity:.5}

  /* テーマ節: 星図Mは夜の相の単一変種（supportedThemes=[DARK]）。3択でなく現在の相を固定表示＝実態に一致 */
  .relay{display:flex;align-items:center;gap:10px}
  .relay .st{width:7px;height:7px;border-radius:50%;background:var(--star);box-shadow:0 0 8px rgba(233,221,180,.75);flex-shrink:0}
  .relay .rt2 .b{font-family:var(--mincho);font-size:14px;color:var(--text)}
  .relay .rt2 .s{font-family:var(--gothic);font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.02em}

  /* トグル（ON＝星光の金） */
  .toggle{width:46px;height:28px;border-radius:14px;background:rgba(150,168,214,.22);position:relative;flex-shrink:0}
  .toggle.on{background:var(--star)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F7F3E1;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .toggle.on .knob{left:21px;background:#141B33}

  /* ===== 恒常ボトムナビ（bookshelf-K.html:229-248 の骨格・SVG・ラベルを固定コピー。色のみ M トークンへ） ===== */
  .tabbar{flex-shrink:0;height:64px;display:flex;border-top:1px solid var(--line);background:var(--navbg)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;cursor:pointer;color:var(--dim)}
  .tab.on{color:var(--star)}
  .tab .ic{position:relative;width:56px;height:32px;display:grid;place-items:center}
  .tab .ic .pill{position:absolute;inset:0;border-radius:16px;background:transparent}
  .tab.on .ic .pill{background:var(--star-tint)}
  .tab .ic svg{position:relative;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab .lb{font-family:var(--gothic);font-size:11px;letter-spacing:.04em}
  .tab.on .lb{font-weight:700}
</style>
</head>
<body>
  <p class="cap"><b>M×K形. 設定</b> ／ 明快Kの節構成（テーマ／きせかえ／通知／診断／情報）＋恒常ボトムナビを、星図Mの夜天・星光で再構成。テーマは星図の実態（夜の相の単一変種）に合わせ固定表示。</p>
  <div class="phone" role="img" aria-label="M×K形 設定画面ドラフト">
    <canvas class="skybg" aria-hidden="true"></canvas>
    <div class="layer">
      <div class="sb"><span>9:41</span><span>●●● ▢ 84%</span></div>

      <!-- ヘッダ（明示タイトル） -->
      <div class="head"><h1>設定</h1></div>

      <div class="scroll">

        <!-- 表示 -->
        <div class="gh">表示</div>
        <div class="group">
          <!-- テーマ: 星図Mは夜の相の単一変種＝3択を畳み現在の相を固定表示。ほかの装いは装いの間へ（機能は消さず所在を示す） -->
          <div class="row">
            <span class="ri"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A5 5 0 0 1 13 5c0-.7.1-1.4.4-2z"/></svg></span>
            <div class="rt relay">
              <span class="st"></span>
              <div class="rt2"><div class="b">星図 ・ 夜の相</div><div class="s">この装いは夜天ひとつ。ほかの相は「きせかえ」から</div></div>
            </div>
          </div>
          <div class="row disabled">
            <span class="ri"><svg viewBox="0 0 24 24"><path d="M5 6.5h14M12 6.5V19"/></svg></span>
            <div class="rt"><div class="rl">文字と組版</div><div class="rd">文字サイズ・行間は読書中の観測パネルから</div></div>
          </div>
          <div class="row">
            <span class="ri"><svg viewBox="0 0 24 24"><path d="M12 2.5 L13.7 10.3 L21.5 12 L13.7 13.7 L12 21.5 L10.3 13.7 L2.5 12 L10.3 10.3 Z"/></svg></span>
            <div class="rt"><div class="rl">きせかえ</div><div class="rd">本棚や画面の装いを変える（現在: 星図）</div></div>
            <div class="rr"><svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
          </div>
        </div>

        <!-- 通知 -->
        <div class="gh">通知</div>
        <div class="group">
          <div class="row">
            <span class="ri"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></span>
            <div class="rt"><div class="rl">新着話の通知</div><div class="rd">Web作品の新しい話を1日1回確認して通知します</div></div>
            <div class="rr"><span class="toggle on"><span class="knob"></span></span></div>
          </div>
        </div>

        <!-- データ -->
        <div class="gh">データ</div>
        <div class="group">
          <div class="row">
            <span class="ri"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 13 2.5-7H21"/></svg></span>
            <div class="rt"><div class="rl">取り込み状態の診断</div><div class="rd">Web取込の健全性を確認（開発版のみ）</div></div>
            <div class="rr"><svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
          </div>
        </div>

        <!-- このアプリ -->
        <div class="gh">このアプリ</div>
        <div class="group">
          <div class="row">
            <span class="ri"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 11.2v5"/><path d="M12 8.2h.01"/></svg></span>
            <div class="rt"><div class="rl">バージョン</div></div>
            <div class="rr"><span class="rv">1.0</span></div>
          </div>
        </div>

      </div>

      <!-- ===== 恒常ボトムナビ（設定 選択中） ===== -->
      <nav class="tabbar">
        <a class="tab">
          <span class="ic"><span class="pill"></span>
            <svg viewBox="0 0 24 24"><path d="M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M4 18a2 2 0 0 1 2-2h12"/></svg>
          </span>
          <span class="lb">本棚</span>
        </a>
        <a class="tab">
          <span class="ic"><span class="pill"></span>
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.4 4.4"/></svg>
          </span>
          <span class="lb">さがす</span>
        </a>
        <a class="tab on">
          <span class="ic"><span class="pill"></span>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </span>
          <span class="lb">設定</span>
        </a>
      </nav>
    </div>
  </div>

<script>
// 星屑（固定・上部に密・夜天の下地）。濃色ダミーでなく夜天を演出する微光の粒＝M意匠の温存
(function(){
  const W=390,H=844,dpr=Math.max(1,window.devicePixelRatio||1);
  const cv=document.querySelector('.skybg'),ctx=cv.getContext('2d');
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.scale(dpr,dpr);
  let seed=24680;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<80;i++){const x=rnd()*W,y=44+rnd()*(H-90),r=rnd()*.9+.25,a=rnd()*(y<300?.4:.22)+.05;
    ctx.fillStyle='rgba(214,224,250,'+a+')';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
  [[70,110,.5],[300,90,.5],[210,150,.42]].forEach(([x,y,a])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,5);g.addColorStop(0,'rgba(233,221,180,'+a+')');g.addColorStop(1,'rgba(233,221,180,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
    ctx.fillStyle='rgba(245,248,255,'+(a+.2)+')';ctx.beginPath();ctx.arc(x,y,1.3,0,7);ctx.fill();});
})();
</script>
</body>
</html>
