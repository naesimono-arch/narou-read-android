<!-- @dsCard group="UI-n / デフォルト（明快K）" name="K. 明快（本棚・リスト表示＝圧縮S・2026-07-24）" -->
<!--
  リスト表示モードの正本（2026-07-24 新設）。従来はモック未規定で D 流用だった本棚リスト型を、
  UIラウンド最終裁定の「圧縮S」で規定する（plan ui-density-swipe-round-2026-07-24 §最終裁定まとめ）。
  圧縮S＝題字明朝2行を温存・著者＋状態を1メタ行へ統合・上下 S24・行高≈127dp・実機約5行/画面
  （実機実効 360dp 幅・PGEM10 実測基準。現行 約3.5行から約1.5倍）。書影なし・左4dp色帯（小口メタファ）。
  ヘッダ／フィルタチップ／ボトムナビは bookshelf-K.html と同一マークアップ（グリッド↔リストは表示切替で往復）。
  トークンは K 正本を流用（新色なし・余白7段スケール）。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K 本棚 — リスト（圧縮S）</title>
<style>
  :root{
    --base:#FBFAF8; --ink:#1C1F26; --ink-soft:#6A6E78; --line:#ECEAE4;
    --ai:#1C3D5A; --ai-tint:rgba(28,61,90,.10);
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E4E3DD;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;font-family:var(--gothic);-webkit-font-smoothing:antialiased}

  /* === スマホ画面枠（実機実効 360dp 幅） === */
  .phone{width:360px;height:820px;background:var(--base);border-radius:38px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.30)}

  .sb{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;font-size:11px;color:var(--ink-soft);letter-spacing:.02em}
  .sb .r{display:flex;gap:6px;align-items:center}

  /* ヘッダ（bookshelf-K と同一マークアップ・表示切替＝グリッドへ戻る） */
  .head{flex-shrink:0;display:flex;align-items:baseline;justify-content:space-between;padding:6px 20px 12px}
  .head .ttl{display:flex;align-items:baseline;gap:10px}
  .head h1{font-family:var(--gothic);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.04em}
  .head .count{font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
  .head .view{width:38px;height:38px;border:none;background:transparent;border-radius:10px;
    display:grid;place-items:center;color:var(--ink);cursor:pointer;align-self:center}
  .head .view:hover{background:var(--line)}
  .head .view svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}

  /* 状態フィルタチップ（bookshelf-K と同一） */
  .chips{flex-shrink:0;display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;font-size:12.5px;padding:6px 15px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);color:var(--ink-soft);background:transparent;letter-spacing:.02em}
  .chip.on{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:600}

  /* 1画面が満ちる様を実寸で見せる＝clip */
  .list{flex:1;overflow:hidden;padding:0 20px}

  /* 圧縮S 行: 書影なし・左4dp色帯・題字明朝2行＋著者・状態を1メタ行へ統合・上下 S24 */
  .lc{position:relative;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);
    padding:24px 4px 24px 16px;cursor:pointer}
  .lc::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:4px;border-radius:2px;
    background:var(--band,var(--ink-soft))}
  .lc .bd{flex:1;min-width:0}
  .lc .t{font-family:var(--mincho);font-size:16px;color:var(--ink);line-height:1.6;min-height:51px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 著者・状態を「・」区切りで1メタ行に統合（圧縮S）。区切りは中黒＝flex gap を使わず余白スケール逸脱を避ける */
  .lc .m{font-family:var(--gothic);font-size:13px;color:var(--ink-soft);margin-top:12px;line-height:1.4}
  .lc .dots{width:32px;height:32px;flex-shrink:0;border:none;background:transparent;color:var(--ink-soft);
    display:grid;place-items:center;cursor:pointer;margin-top:2px}
  .lc .dots svg{width:16px;height:16px;fill:currentColor}

  /* ===== 共通ボトムナビ（bookshelf-K と同一） ===== */
  .tabbar{flex-shrink:0;height:64px;display:flex;border-top:1px solid var(--line);background:var(--base)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-decoration:none;cursor:pointer;color:var(--ink-soft)}
  .tab.on{color:var(--ai)}
  .tab .ic{position:relative;width:56px;height:32px;display:grid;place-items:center}
  .tab .ic .pill{position:absolute;inset:0;border-radius:16px;background:transparent}
  .tab.on .ic .pill{background:var(--ai-tint)}
  .tab .ic svg{position:relative;width:24px;height:24px;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab .lb{font-family:var(--gothic);font-size:11px;letter-spacing:.04em}
  .tab.on .lb{font-weight:700}
</style>
</head>
<body>
  <div class="phone">
    <div class="sb"><span>9:41</span><span class="r">5G ▾ ▮▮▮</span></div>

    <div class="head">
      <div class="ttl"><h1>本棚</h1><span class="count">12冊</span></div>
      <button class="view" aria-label="表示切替（リスト選択中）">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.6" height="6.6" rx="1.4"/><rect x="13.4" y="4" width="6.6" height="6.6" rx="1.4"/><rect x="4" y="13.4" width="6.6" height="6.6" rx="1.4"/><rect x="13.4" y="13.4" width="6.6" height="6.6" rx="1.4"/></svg>
      </button>
    </div>

    <div class="chips">
      <span class="chip on">すべて</span>
      <span class="chip">よみかけ</span>
      <span class="chip">未読</span>
      <span class="chip">読了</span>
    </div>

    <!-- 圧縮S リスト（≈5行/画面） -->
    <div class="list">
      <div class="lc" style="--band:hsl(210 48% 52%)"><div class="bd"><div class="t">追放された万能薬師、辺境でスローライフを始める</div><div class="m"><span>霧島あおい</span>・<span>第127/205話</span></div></div><button class="dots" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>
      <div class="lc" style="--band:hsl(280 48% 52%)"><div class="bd"><div class="t">黒の魔王と契約した俺、気づけば最強の従者に</div><div class="m"><span>夜灯すばる</span>・<span>第43/150話</span></div></div><button class="dots" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>
      <div class="lc" style="--band:hsl(150 48% 52%)"><div class="bd"><div class="t">異界の栞と紙の旅</div><div class="m"><span>白河すずら</span>・<span>未読</span></div></div><button class="dots" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>
      <div class="lc" style="--band:hsl(340 48% 52%)"><div class="bd"><div class="t">公爵令嬢の嗜み 〜隣国で薬草園を開きます〜</div><div class="m"><span>青葉みのり</span>・<span>第8/72話</span></div></div><button class="dots" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>
      <div class="lc" style="--band:hsl(230 48% 52%)"><div class="bd"><div class="t">星降る夜の図書館で君を待っている</div><div class="m"><span>水無月れん</span>・<span>読了</span></div></div><button class="dots" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>
      <div class="lc" style="--band:hsl(95 48% 52%)"><div class="bd"><div class="t">辺境ぐらしの隠居魔導士、今日ものんびり</div><div class="m"><span>霜月かなで</span>・<span>第55/98話</span></div></div><button class="dots" aria-label="メニュー"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>
    </div>

    <nav class="tabbar">
      <a class="tab on">
        <span class="ic"><span class="pill"></span>
          <svg viewBox="0 0 24 24"><path d="M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M4 18a2 2 0 0 1 2-2h12"/></svg>
        </span>
        <span class="lb">本棚</span>
      </a>
      <a class="tab">
        <span class="ic"><span class="pill"></span>
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.4 4.4"/></svg>
        </span>
        <span class="lb">さがす</span>
      </a>
      <a class="tab">
        <span class="ic"><span class="pill"></span>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span class="lb">設定</span>
      </a>
    </nav>
  </div>
</body>
</html>
