<!-- @dsCard group="UI-n / K形伝播ドラフト（スキンJ）" name="J×K形. 設定 — 扉の意匠に明快Kの形（テーマ/きせかえ/新着話通知/診断/情報＋恒常ナビ）" -->
<!--
  K形伝播ドラフト（settings-J）。K plan の確定事項6に従う。
  ・伝播する「形」= 明示タイトル「設定」・節構成〈表示(テーマ/文字と組版/きせかえ=装いの間入口)／
    通知(新着話の通知＋説明文)／データ((debug)取り込み状態の診断)／このアプリ(バージョン)〉・恒常ボトムナビ(設定選択中)。
    ボトムナビ骨格は bookshelf-K.html:229-248 を固定コピー・色のみJトークン。
  ・温存する意匠 = Jポータルの森ダーク世界・上部の淡い森金大気・金(選択/トグルON)の1系統強調・
    設定は"身支度の静けさ"＝余白主導。グループ＝森の面のカード＋金のトグル。
  ・注記: JのsettingsソースはReadingSettingsシート(テーマ/文字サイズ/行間)だが、本ドラフトはK形のアプリ設定画面。
    Jのシートから配色語彙(森ダーク面・金強調・淡い大気)のみ継承し、構造はK形の節構成を採る。
    「きせかえ」現在値はこのモックの装い＝ポータルを表示（装いの間入口＝ADR 0021 決定7）。
  署名色: 金(選択・トグルON/選択タブ)1系統。単一画面・ダークのみ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J×K形 設定 — 扉の意匠に明快の形</title>
<style>
  :root{
    --page:#0F1712; --surface:#141C15; --card:#16211A;
    --ink:#E7ECE1; --soft:rgba(233,240,228,.58); --soft2:rgba(233,240,228,.40);
    --line:rgba(233,240,228,.10);
    --gold:#E2C878; --gold-tint:rgba(226,200,120,.16);
    --track:rgba(233,240,228,.16);
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070806;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;font-family:var(--gothic);-webkit-font-smoothing:antialiased}

  .phone{width:390px;height:844px;background:var(--page);border-radius:42px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;box-shadow:0 26px 64px rgba(0,0,0,.7)}
  /* 上部の淡い森金大気（J温存・設定は静かなので希薄） */
  .phone::before{content:"";position:absolute;left:0;right:0;top:0;height:200px;z-index:0;pointer-events:none;
    background:radial-gradient(90% 70% at 50% -8%,rgba(214,196,120,.09),transparent 58%),
              radial-gradient(120% 80% at 50% -18%,rgba(39,64,48,.45),transparent 60%)}

  .sb{position:relative;z-index:2;height:40px;flex-shrink:0;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;font-size:11px;color:var(--soft)}

  /* ヘッダ: 明示タイトル「設定」（明朝＝J踏襲） */
  .head{position:relative;z-index:2;flex-shrink:0;padding:6px 24px 14px}
  .head h1{font-family:var(--mincho);font-size:26px;font-weight:500;color:var(--ink);letter-spacing:.12em}

  .scroll{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 22px 24px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* グループ見出し（淡色字間・J回廊ラベルの語彙） */
  .gh{font-size:11px;color:var(--soft2);letter-spacing:.24em;margin:22px 4px 10px}
  .gh:first-child{margin-top:6px}

  /* グループ＝森の面のカード＋ヘアライン枠。行間はヘアライン区切り */
  .group{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}

  /* 各行: 24pxアイコン＋主ラベル(15px)＋説明文(12.5px soft) */
  .row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .ri{width:24px;height:24px;flex-shrink:0;color:var(--soft)}
  .ri svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rt{flex:1;min-width:0}
  .rl{font-family:var(--gothic);font-size:15px;color:var(--ink);letter-spacing:.02em}
  .rd{font-size:12.5px;color:var(--soft);line-height:1.5;margin-top:4px;letter-spacing:.01em}
  .rr{flex-shrink:0;display:flex;align-items:center;gap:8px}
  .rv{font-size:13px;color:var(--soft);letter-spacing:.02em}
  .chev{width:18px;height:18px;fill:none;stroke:var(--soft);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  /* きせかえ行の値＝金（装いの間入口の強調） */
  .rv.gold{color:var(--gold)}

  /* 非活性風の行（文字と組版＝読書中設定へ委譲） */
  .row.disabled{opacity:.5}

  /* トグル（ON＝金） */
  .toggle{width:46px;height:28px;border-radius:14px;background:var(--track);position:relative}
  .toggle.on{background:var(--gold)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#0F1712;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .toggle.on .knob{left:21px;background:#15241A}

  /* ===== 恒常ボトムナビ（bookshelf-K.html:229-248 の骨格を固定コピー・色のみJトークン） ===== */
  .tabbar{position:relative;z-index:6;flex-shrink:0;height:64px;display:flex;border-top:1px solid var(--line);background:var(--surface)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-decoration:none;cursor:pointer;color:var(--soft)}
  .tab.on{color:var(--gold)}
  .tab .ic{position:relative;width:56px;height:32px;display:grid;place-items:center}
  .tab .ic .pill{position:absolute;inset:0;border-radius:16px;background:transparent}
  .tab.on .ic .pill{background:var(--gold-tint)}
  .tab .ic svg{position:relative;width:24px;height:24px;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab .lb{font-family:var(--gothic);font-size:11px;letter-spacing:.04em}
  .tab.on .lb{font-weight:700}
</style>
</head>
<body>
  <div class="phone" role="img" aria-label="J×K形 設定">
    <div class="sb"><span>9:41</span><span>●●● 84%</span></div>

    <!-- ヘッダ -->
    <div class="head"><h1>設定</h1></div>

    <div class="scroll">

      <!-- 表示 -->
      <div class="gh">表示</div>
      <div class="group">
        <div class="row">
          <span class="ri"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></span>
          <div class="rt"><div class="rl">テーマ</div></div>
          <div class="rr"><span class="rv">システムに従う</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
        </div>
        <div class="row disabled">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M5 6.5h14M12 6.5V19"/></svg></span>
          <div class="rt"><div class="rl">文字と組版</div><div class="rd">文字サイズ・行間は読書中の表示設定から</div></div>
        </div>
        <div class="row">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 0 0 16c1 0 1.5-.8 1.5-1.6 0-1 .8-1.4 1.6-1.4H17a3 3 0 0 0 3-3c0-4.4-3.6-8-8-8z"/><circle cx="8.2" cy="11" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="8.4" r=".9" fill="currentColor" stroke="none"/><circle cx="15.6" cy="11" r=".9" fill="currentColor" stroke="none"/></svg></span>
          <!-- 説明を短縮: 右端の現在値「ポータル」と折返しが視覚衝突したため（監督検分 2026-07-23） -->
          <div class="rt"><div class="rl">きせかえ</div><div class="rd">本棚や画面の装いを変える</div></div>
          <div class="rr"><span class="rv gold">ポータル</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
        </div>
      </div>

      <!-- 通知 -->
      <div class="gh">通知</div>
      <div class="group">
        <div class="row">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></span>
          <div class="rt"><div class="rl">新着話の通知</div><div class="rd">Web作品の新しい話を1日1回確認して通知します</div></div>
          <div class="rr"><span class="toggle on"><span class="knob"></span></span></div>
        </div>
      </div>

      <!-- データ -->
      <div class="gh">データ</div>
      <div class="group">
        <div class="row">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 13 2.5-7H21"/></svg></span>
          <div class="rt"><div class="rl">取り込み状態の診断</div><div class="rd">Web取込の健全性を確認（開発版のみ）</div></div>
          <div class="rr"><svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
        </div>
      </div>

      <!-- このアプリ -->
      <div class="gh">このアプリ</div>
      <div class="group">
        <div class="row">
          <span class="ri"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 11.2v5"/><path d="M12 8.2h.01"/></svg></span>
          <div class="rt"><div class="rl">バージョン</div></div>
          <div class="rr"><span class="rv">1.0</span></div>
        </div>
      </div>

    </div>

    <!-- ===== 恒常ボトムナビ（設定 選択中／K骨格を固定コピー） ===== -->
    <nav class="tabbar">
      <a class="tab">
        <span class="ic"><span class="pill"></span>
          <svg viewBox="0 0 24 24"><path d="M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M4 18a2 2 0 0 1 2-2h12"/></svg>
        </span>
        <span class="lb">本棚</span>
      </a>
      <a class="tab">
        <span class="ic"><span class="pill"></span>
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.4 4.4"/></svg>
        </span>
        <span class="lb">さがす</span>
      </a>
      <a class="tab on">
        <span class="ic"><span class="pill"></span>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span class="lb">設定</span>
      </a>
    </nav>
  </div>
</body>
</html>
