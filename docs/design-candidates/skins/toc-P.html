<!-- @dsCard group="UI-n / K形伝播ドラフト" name="P. カートリッジ（目次・K形伝播ドラフト）" -->
<!--
  K形伝播ドラフト＝明快Kの「形」をカートリッジPの意匠へ移植（目次画面）。深い画面＝ボトムナビは出さない（Kと同じ没入優先）。
  ・温存（P意匠）: 目次＝ステージセレクトのマップ（蛇行する道＋ステージノード＋ドット絵の駒）／緑LCDの携帯機HUD／
    退色プラ筐体＋ネジ＋銘板デッキ／装飾有彩は緑LCD1系統（退色トーン）。
  ・組込（K形）: ①明示タイトル「目次」＋作品名サブ ②現在地チップ「いま読んでいる ▸ 第N話」（HUD内・タップで現在章へ）
    ③現在章に唯一の実アクション「ここから再開」 ④既読は題名を沈めて✓。
  ・静止則（ADR 0022 §3）遵守＝keyframes/明滅/自動再生ゼロ。JSは道・ノード・駒・ゲージの形状生成のみ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K形伝播 P 目次 — カートリッジ</title>
<style>
  :root{
    --plastic:#dbd6c8; --plastic-hi:#e9e5da; --plastic-lo:#c3bfae; --panel:#cfcabb;
    --ink:#2c2b26; --ink-soft:#79766b; --ink-mid:#5a574c; --line:#bdb9a9;
    --lcd:#a4af80; --lcd-hi:#b4be92; --lcd-ink:#2b3616; --lcd-band:#ccd4a8;   /* 装飾有彩=緑LCD1系統のみ */
    --pixel:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2a2c27;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px;font-family:var(--gothic)}
  .cap{color:#c8c3b4;font-size:12.5px;margin-bottom:16px;text-align:center;line-height:1.7;max-width:520px}
  .cap b{color:#f0ede2}

  /* ===== 筐体 ===== */
  .phone{width:390px;height:844px;border-radius:34px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--plastic-hi),var(--plastic) 22%,var(--plastic-lo));
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 8px rgba(0,0,0,.14);
    display:flex;flex-direction:column;color:var(--ink)}
  .screw{position:absolute;width:9px;height:9px;border-radius:50%;z-index:9;
    background:radial-gradient(circle at 35% 30%,#e7e3d7,#a8a496 70%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .screw::after{content:"";position:absolute;inset:2.5px;border-top:1.4px solid rgba(0,0,0,.28);transform:rotate(40deg)}
  .screw.tl{top:14px;left:14px}.screw.tr{top:14px;right:14px}.screw.bl{bottom:14px;left:14px}.screw.br{bottom:14px;right:14px}
  .sb{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;flex-shrink:0;
    font-family:var(--pixel);font-size:11px;letter-spacing:.06em;color:var(--ink-soft)}
  .sb .batt b{display:inline-block;width:16px;height:8px;border:1.4px solid var(--ink-soft);border-radius:1px;position:relative}
  .sb .batt b::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink-soft)}

  /* topbar相当（戻る＋K形の明示タイトル「目次」＋作品名サブ） */
  .top{display:flex;align-items:center;gap:6px;padding:2px 12px 8px;flex-shrink:0}
  .top .ib{width:42px;height:42px;flex-shrink:0;border:none;background:transparent;border-radius:11px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
  .top .ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  .top .htxt{min-width:0}
  .top .htxt h1{font-family:var(--gothic);font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.02em;line-height:1.15}
  .top .htxt .work{font-family:var(--gothic);font-size:12.5px;color:var(--ink-soft);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ===== 携帯機HUD（緑LCD）＝K形の現在地チップ＋進捗 ===== */
  .hud{margin:2px 20px 12px;flex-shrink:0;border-radius:12px;padding:11px 13px;position:relative;overflow:hidden;
    display:flex;align-items:center;gap:11px;
    background:radial-gradient(120% 130% at 50% 0%,var(--lcd-hi),var(--lcd));
    box-shadow:inset 0 0 0 1px rgba(43,54,22,.28), inset 0 2px 5px rgba(43,54,22,.16), 0 1px 0 rgba(255,255,255,.4)}
  .hud::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(43,54,22,.15) .6px,transparent .7px);background-size:3px 3px}
  .hud .av{width:36px;height:36px;flex-shrink:0;border-radius:7px;position:relative;z-index:2;display:grid;place-items:center;
    background:rgba(43,54,22,.1);box-shadow:inset 0 0 0 1px rgba(43,54,22,.32)}
  .hud .mid{position:relative;z-index:2;flex:1;min-width:0}
  /* 現在地チップ（K形・タップで現在章へ）＝LCD刻印風の枠チップ */
  .hud .herechip{display:inline-flex;align-items:center;gap:6px;font-family:var(--gothic);font-size:12.5px;font-weight:700;
    color:var(--lcd-ink);border:1.4px solid rgba(43,54,22,.55);border-radius:999px;padding:5px 12px;cursor:pointer;line-height:1}
  .hud .herechip .pin{font-family:var(--pixel);font-size:10px}
  .hud .k{font-family:var(--pixel);font-size:8.5px;letter-spacing:.2em;color:var(--lcd-ink);opacity:.72;margin-top:7px}
  .hud .rt{position:relative;z-index:2;flex-shrink:0;text-align:right}
  .hud .rt .g{display:flex;gap:1.5px;justify-content:flex-end}
  .hud .rt .g i{width:4px;height:11px;background:rgba(43,54,22,.18)}
  .hud .rt .g i.on{background:var(--lcd-ink)}
  .hud .rt .pc{font-family:var(--pixel);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--lcd-ink);margin-top:5px}

  /* ===== ステージセレクトのスクロール面 ===== */
  .scroll{flex:1;overflow:auto;scrollbar-width:none;padding:4px 0 8px}.scroll::-webkit-scrollbar{display:none}
  .trail{position:relative}
  /* 章行＝ステージ。左レーン(72px)に道と駒・右カラムに章題（一定の開始位置=可読） */
  .row{height:66px;display:flex;align-items:center;padding:0 18px 0 88px;position:relative;cursor:pointer;gap:10px}
  .row .rtitle{flex:1;min-width:0;font-family:var(--gothic);font-size:14.5px;line-height:1.42;color:var(--ink);font-weight:400;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 既読＝題名を沈めて行末に✓（K形） */
  .row.done .rtitle{color:var(--ink-soft)}
  .row.done .rcheck{flex-shrink:0;width:18px;height:18px;display:grid;place-items:center;color:var(--lcd-ink);opacity:.85}
  .row.done .rcheck svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}
  /* 現在の章＝緑LCDの帯＋太字＋唯一の実アクション「ここから再開」（K形の1点強調） */
  .row.cur{background:var(--lcd-band)}
  .row.cur .rtitle{color:var(--lcd-ink);font-weight:700}
  .row.cur .resume{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-family:var(--gothic);font-size:11.5px;font-weight:800;
    color:var(--lcd-ink);background:var(--lcd);border:1px solid rgba(43,54,22,.5);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  /* 道とノードのSVG（レーン内=x<72。章題は x≥88 で重ならない） */
  .road{position:absolute;left:0;top:0;pointer-events:none;z-index:3}

  /* 機体フッター（銘板デッキ＝P温存。ボトムナビは深い画面ゆえ非表示） */
  .deck{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 26px 12px}
  .deck .holes{display:flex;gap:4px}
  .deck .holes i{width:5px;height:5px;border-radius:50%;background:var(--plastic-lo);box-shadow:inset 0 1px 1px rgba(0,0,0,.2)}
  .deck .mk{font-family:var(--pixel);font-size:9px;letter-spacing:.18em;color:var(--ink-soft)}
</style>
</head>
<body>
  <p class="cap"><b>P. カートリッジ ／ 目次（K形伝播ドラフト）</b> ／ ステージセレクトのマップ（蛇行する道＋ステージノード＋駒）と緑LCDのHUDを温存し、明示タイトル「目次」＋作品名サブ・現在地チップ・現在章の「ここから再開」・既読✓を組込。深い画面ゆえボトムナビ無し。</p>

  <div class="phone" role="group" aria-label="P案 目次 ステージセレクト（K形伝播）">
    <span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>
    <div class="sb"><span>9:41</span><span class="batt"><b></b></span></div>

    <!-- K形: 明示タイトル＋作品名サブ -->
    <div class="top">
      <button class="ib" aria-label="本棚に戻る"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="htxt">
        <h1>目次</h1>
        <div class="work">追放された万能薬師、辺境でスローライフを始める</div>
      </div>
    </div>

    <!-- HUD（緑LCD）: 現在地チップ＋進捗 -->
    <div class="hud" aria-label="現在地 第127話・全340話中・読了62パーセント">
      <span class="av" id="hudav" aria-hidden="true"></span>
      <div class="mid">
        <span class="herechip" role="button" aria-label="いま読んでいる第127話へ移動"><span class="pin">▶</span> いま読んでいる ・ 第127 / 全340話</span>
        <div class="k">STAGE SELECT</div>
      </div>
      <div class="rt">
        <div class="g" data-n="20" data-f="12"></div>
        <div class="pc">CLEAR 62%</div>
      </div>
    </div>

    <div class="scroll"><div class="trail" id="trail"></div></div>

    <div class="deck">
      <div class="holes"><i></i><i></i><i></i><i></i><i></i></div>
      <span class="mk">POCKET NOVEL · COLOR</span>
      <div class="holes"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

<script>
  /* 幾何は定数から算出＝道・ノード・章題の縦位置は必ず一致（座標のだぶり防止） */
  const ROW_H=66, LANE=72, COLX=[24,50], R=16, RC=19;
  const CX=i=>COLX[i%2], CY=i=>i*ROW_H+ROW_H/2;
  const HERO=[ "..####..",".######.",".#.##.#.","..####..",".######.","#.####.#","..#..#..",".##..##." ];
  const NS='http://www.w3.org/2000/svg';
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  function drawSprite(parent,cx,cy,ps,col){
    const ox=cx-4*ps, oy=cy-4*ps;
    HERO.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch==='#') parent.appendChild(mk('rect',{x:ox+x*ps,y:oy+y*ps,width:ps,height:ps,fill:col})); }));
  }

  /* 章データ＝現在(127)の3つ手前(124)から表示＝「現在章の手前からの表示」を満たす */
  const CH=[
    {n:124,t:'遠雷、辺境の街道を行く',s:'done'},
    {n:125,t:'古い井戸と、忘れられた約束',s:'done'},
    {n:126,t:'夜営の火、語られぬ過去のこと',s:'done'},
    {n:127,t:'雨上がりの城門にて、彼女は静かに剣を置いた',s:'cur'},
    {n:128,t:'市場のざわめきと、薬草の値段',s:'fut'},
    {n:129,t:'領主の館へ、招かれざる客として',s:'fut'},
    {n:130,t:'長い夜の終わりに交わした言葉',s:'fut'},
    {n:131,t:'旅立ちの朝、薬箱を背負って',s:'fut'},
    {n:132,t:'峠の茶屋、見知らぬ剣士との出会い',s:'fut'},
    {n:133,t:'川霧の渡し場、無口な船頭のこと',s:'fut'},
    {n:134,t:'崩れかけた砦に残されていたもの',s:'fut'},
    {n:135,t:'星降る夜更け、交わした小さな約束',s:'fut'},
  ];
  const ci=CH.findIndex(c=>c.s==='cur');
  const trail=document.getElementById('trail');
  const CHECK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

  /* 章題の行（右カラム）。縦位置は行高66px固定でノードと一致。既読=✓／現在=ここから再開 */
  CH.forEach((c)=>{
    const row=document.createElement('div');
    row.className='row '+c.s;
    row.setAttribute('role','button');
    row.setAttribute('aria-label', c.s==='cur' ? ('第'+c.n+'話 '+c.t+'（現在の章）') : (c.s==='done' ? ('第'+c.n+'話 '+c.t+'（既読）') : ('第'+c.n+'話 '+c.t)));
    const tx=document.createElement('div'); tx.className='rtitle'; tx.textContent=c.t; row.appendChild(tx);
    if(c.s==='cur'){ const rs=document.createElement('span'); rs.className='resume'; rs.setAttribute('role','button'); rs.innerHTML='▶ ここから再開'; row.appendChild(rs); }
    else if(c.s==='done'){ const ck=document.createElement('span'); ck.className='rcheck'; ck.setAttribute('aria-hidden','true'); ck.innerHTML=CHECK; row.appendChild(ck); }
    trail.appendChild(row);
  });

  /* 道とノードのSVG（レーン=x<72） */
  const H=CH.length*ROW_H;
  const svg=mk('svg',{class:'road',width:LANE,height:H,viewBox:'0 0 '+LANE+' '+H});
  /* ① 道の区間。読了区間=灯った太道＋点線センターライン／未読=暗い破線 */
  for(let i=0;i<CH.length-1;i++){
    const x1=CX(i),y1=CY(i),x2=CX(i+1),y2=CY(i+1);
    if((i+1)<=ci){
      svg.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#a4af80','stroke-width':9,'stroke-linecap':'round'}));
      svg.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#2b3616','stroke-width':1.6,'stroke-linecap':'round','stroke-dasharray':'1.5 3.5'}));
    }else{
      svg.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#c3bfae','stroke-width':6,'stroke-linecap':'round','stroke-dasharray':'2.5 6'}));
    }
  }
  /* ② ノード（道の上）。読了=緑充填／現在=大きい緑＋ドット絵の駒／未読=空 */
  CH.forEach((c,i)=>{
    const cx=CX(i),cy=CY(i);
    if(c.s==='cur'){
      svg.appendChild(mk('circle',{cx,cy,r:RC,fill:'#b4be92',stroke:'#2b3616','stroke-width':2}));
      drawSprite(svg,cx,cy,3.1,'#2b3616');
    }else{
      const done=c.s==='done';
      svg.appendChild(mk('circle',{cx,cy,r:R,fill:done?'#a4af80':'#e6e2d6',stroke:done?'none':'#bdb9a9','stroke-width':done?0:1.5}));
      const num=mk('text',{x:cx,y:cy+0.5,'text-anchor':'middle','dominant-baseline':'central',
        'font-family':'ui-monospace,Menlo,Consolas,monospace','font-size':11,'font-weight':700,
        fill:done?'#2b3616':'#5a574c'});
      num.textContent=c.n; svg.appendChild(num);
    }
  });
  trail.appendChild(svg);

  /* HUDのアバター（同じ駒スプライト） */
  const av=mk('svg',{width:22,height:22,viewBox:'0 0 22 22'});
  drawSprite(av,11,11,2.4,'#2b3616');
  document.getElementById('hudav').appendChild(av);

  /* HUD進捗ゲージ（62%=20分割中12灯） */
  document.querySelectorAll('[data-n]').forEach(el=>{
    const n=+el.dataset.n, f=+el.dataset.f;
    for(let i=0;i<n;i++){ const s=document.createElement('i'); if(i<f) s.className='on'; el.appendChild(s); }
  });
</script>
</body>
</html>
