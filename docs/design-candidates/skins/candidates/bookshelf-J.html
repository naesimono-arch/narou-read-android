<!-- @dsCard group="UI-n / 本棚（斬新案）" name="J. ポータル・デッキ（1作1画面・横スワイプの没入扉）" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI-n J 本棚 — ポータル・デッキ</title>
<style>
  /* ===== J案: ポータル・デッキ =====
     破壊するもの: 「一覧＝グリッド/リスト」というナビゲーション。
     ★本棚を捨て、1作=1画面の没入ポータルにして横スワイプでめくる。各作は「その物語世界への扉」。
     実画像が無い制約を、bookId由来の"大気(ambient)"グラデ＋象徴1文字で埋める＝捏造表紙より誠実。
     異世界転移モノが主流のなろうの「扉の向こうへ」というモチーフに直結。
     2モード対応: これが既定(没入デッキ)。右上アイコンで素早い「全体グリッド」へ切替＝従来の一覧をサブに降格。 */
  :root{
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0C0E0B;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:26px;font-family:var(--gothic)}
  .cap{color:#9DAE97;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.7;max-width:520px}.cap b{color:#E9F0E4}
  .phone{width:390px;height:844px;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 26px 64px rgba(0,0,0,.7)}
  /* いま見えているポータル(万能薬師=森と薬草の大気) */
  .portal{position:absolute;inset:0;z-index:1;
    background:
      radial-gradient(90% 60% at 50% 8%,rgba(214,196,120,.30),transparent 55%),
      radial-gradient(120% 80% at 50% 120%,rgba(20,46,30,.9),transparent 60%),
      linear-gradient(165deg,#274030,#15241A 55%,#0E1812)}
  /* 大気に浮く象徴文字(うっすら) */
  .glyph{position:absolute;top:6%;left:50%;transform:translateX(-50%);font-family:var(--mincho);font-size:300px;line-height:1;
    color:rgba(233,240,228,.05);z-index:1;pointer-events:none}
  /* 隣のポータルの覗き見(左右に色違いの帯) */
  .peek{position:absolute;top:0;bottom:0;width:14px;z-index:4}
  .peek.l{left:0;background:linear-gradient(90deg,rgba(90,60,110,.9),transparent)}
  .peek.r{right:0;background:linear-gradient(270deg,rgba(150,40,60,.9),transparent)}
  .sb{position:relative;z-index:5;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:11px;color:rgba(233,240,228,.7)}
  .topctl{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:2px 22px 0}
  .topctl .idx{font-family:var(--mincho);font-size:13px;color:rgba(233,240,228,.85);letter-spacing:.12em}
  .topctl .grid{width:40px;height:40px;border:1px solid rgba(233,240,228,.25);background:rgba(0,0,0,.2);border-radius:11px;display:grid;place-items:center;color:#E9F0E4;cursor:pointer;backdrop-filter:blur(6px)}
  .topctl .grid svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
  /* 本体 */
  .body{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 30px 18px}
  .body .arc{font-family:var(--gothic);font-size:11px;letter-spacing:.3em;color:#E2C878;margin-bottom:16px}
  .body .ttl{font-family:var(--mincho);font-size:38px;line-height:1.28;color:#F1F4EC;font-weight:600;text-shadow:0 2px 24px rgba(0,0,0,.5)}
  .body .by{font-size:12.5px;color:rgba(233,240,228,.7);margin-top:14px;letter-spacing:.06em}
  .body .incipit{font-family:var(--mincho);font-size:13px;color:rgba(233,240,228,.78);line-height:1.9;margin-top:18px;
    border-left:2px solid rgba(226,200,120,.6);padding-left:13px}
  /* 進捗(旅の途中) */
  .body .prog{margin-top:22px}
  .body .prog .pl{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(233,240,228,.7);margin-bottom:7px}
  .body .prog .pl b{font-family:var(--mincho);color:#F1F4EC;font-size:13px}
  .body .prog .pb{height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
  .body .prog .pb i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#E2C878,#9FCFA9)}
  .body .resume{margin-top:22px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
    background:#E9F0E4;color:#15241A;border:none;cursor:pointer;padding:17px;border-radius:16px;font-weight:800;font-size:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .body .resume svg{width:18px;height:18px;fill:#15241A}
  /* ページドット */
  .dots{position:relative;z-index:5;display:flex;justify-content:center;gap:8px;padding-bottom:22px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(233,240,228,.3)}
  .dots i.on{width:22px;border-radius:4px;background:#E9F0E4}
  .hint{position:absolute;z-index:5;bottom:54px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(233,240,228,.45);letter-spacing:.1em}
</style>
</head>
<body>
  <p class="cap"><b>J. ポータル・デッキ</b> ／ 一覧(グリッド)を廃し、<b>1作=1画面の没入ポータルを横スワイプ</b>でめくる。各作はその物語世界への"扉"。右上から従来のグリッド一覧へ降りられる。</p>
  <div class="phone" role="img" aria-label="J案 ポータルデッキの本棚">
    <div class="portal"></div>
    <div class="glyph">薬</div>
    <div class="peek l" aria-hidden="true"></div>
    <div class="peek r" aria-hidden="true"></div>

    <div class="sb"><span>9:41</span><span>●●● 84%</span></div>
    <div class="topctl">
      <span class="idx">1 / 4</span>
      <button class="grid" aria-label="全体をグリッドで見る"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
    </div>

    <div class="body">
      <div class="arc">辺境編 · 第127話</div>
      <div class="ttl">追放された万能薬師、辺境でスローライフを始める</div>
      <div class="by">霧島あおい</div>
      <div class="incipit">辺境の城門に辿り着いたのは、長い雨がようやく上がった頃だった。</div>
      <div class="prog">
        <div class="pl"><span>旅の途中</span><span><b>62%</b> · 残り213話</span></div>
        <div class="pb"><i></i></div>
      </div>
      <button class="resume"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg>続きから読む</button>
    </div>

    <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="hint">← スワイプで次の物語へ →</div>
  </div>
</body>
</html>
