<!-- @dsCard group="UI-n / 読書設定（スキン候補）" name="Q. 読書の庭 — 表示設定シート（テーマ3択＝苔選択／文字サイズ／行間・D構造にQトークンを写像）" -->
<!--
  思想の翻訳: 読書画面から立ち上がるボトムシート。庭の紙の上に道具を静かに並べ、選択中だけを苔色で灯す。
  D正本(settings-D)の機能を全数踏襲: グラブ／見出し「表示設定」／適用範囲の注記／テーマ3択（選択＝色塗り）／文字サイズ（14〜24sp）／行間（2.3〜2.8）／背後の本文＋スクリム。項目は実機能と1対1、配色・書体のみQへ写像。スキン選択UIは入れない（本棚から入る体験＝別）。
  余白: 節と節の間を広く空け、設定を詰め込まない（沈黙の面を残す）。
  避けたもの: 進捗の花色bloomをここで使わない（設定に成長表現は無いため）。強調は選択チップの苔1点のみ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI-n Q 表示設定 — 読書の庭</title>
<style>
  :root{
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --sheet:#EDE8DC; --ink:#38372E; --meta:#5C5A4B; --moss:#5B6642; --furrow:#D8D0BF; --cream:#F2EDE1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2A2A24;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px;font-family:var(--gothic)}
  .cap{color:#B7B29F;font-size:13px;line-height:1.75;text-align:center;max-width:640px;margin-bottom:16px}
  .cap b{color:#EDE8DC}

  .phone{width:390px;height:844px;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    background:#E7E1D4;box-shadow:0 26px 64px rgba(0,0,0,.55)}

  /* 背後にうっすら本文（シートで暗転）＝文脈を示すだけの装飾 */
  .behind{position:absolute;inset:0;padding:64px 30px;font-family:var(--mincho);font-size:16px;line-height:2.4;
    color:#CBC4B6;text-indent:1em;overflow:hidden}
  .scrim{position:absolute;inset:0;background:rgba(30,30,26,.30)}

  /* ボトムシート＝庭の紙 */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:22px 22px 0 0;
    padding:14px 26px 36px;box-shadow:0 -12px 34px rgba(0,0,0,.20)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--furrow);margin:0 auto 20px}
  .sheet h2{font-family:var(--mincho);font-size:18px;color:var(--ink);font-weight:600;letter-spacing:.1em;margin-bottom:6px}
  .scope-note{font-family:var(--gothic);font-size:11px;color:var(--meta);letter-spacing:.04em;line-height:1.5;margin-bottom:32px}

  .sec{margin-bottom:32px}
  .sec:last-child{margin-bottom:0}
  .lbl{font-family:var(--gothic);font-size:12px;color:var(--meta);letter-spacing:.06em;margin-bottom:14px}
  .row-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .row-lbl .lbl{margin:0}
  .val{font-family:var(--gothic);font-size:12px;color:var(--moss);font-weight:600}

  /* テーマ3択チップ。選択＝苔塗り＋クリーム文字／非選択＝ヘアライン枠 */
  .chips{display:flex;gap:12px}
  .chip{flex:1;text-align:center;padding:14px 0;border-radius:12px;font-family:var(--gothic);font-size:13.5px;
    border:1px solid var(--furrow);color:var(--ink);background:transparent;cursor:pointer}
  .chip.on{background:var(--moss);border-color:var(--moss);color:var(--cream);font-weight:600}

  /* スライダー（文字サイズ・行間）。両端ラベル＋トラック＋苔つまみ */
  .slider{display:flex;align-items:center;gap:16px}
  .end{font-family:var(--mincho);color:var(--ink);flex-shrink:0}
  .end.g{font-family:var(--gothic);font-size:12px;color:var(--meta)}
  .track{flex:1;height:2px;background:var(--furrow);position:relative;border-radius:2px}
  .track .fill{position:absolute;left:0;top:0;height:2px;background:var(--moss);border-radius:2px}
  .track .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--moss);
    transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(91,102,66,.4)}
</style>
</head>
<body>
  <p class="cap"><b>Q. 読書の庭 — 表示設定</b> ／ 読書画面から立ち上がるボトムシート。settings-Dの機能（適用範囲の注記・テーマ3択・文字サイズ 14〜24sp・行間 2.3〜2.8・背後の本文＋スクリム）を全数踏襲し、選択中だけ苔色で灯す。節間を広く空けて詰め込まない。</p>
  <div class="phone" role="img" aria-label="Q案 表示設定シート">
    <div class="behind">辺境の城門に辿り着いたのは、長い雨がようやく上がった頃だった。濡れた石畳が夕陽を照り返し、橙の光が水たまりに滲んでいる。彼女はそう呟くと、腰の剣をそっと地に置いた。</div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="grab"></div>
      <h2>表示設定</h2>
      <p class="scope-note">配色や文字の設定は、すべての本に適用されます</p>

      <div class="sec">
        <div class="lbl">テーマ</div>
        <div class="chips">
          <button class="chip on">ライト</button>
          <button class="chip">セピア</button>
          <button class="chip">ダーク</button>
        </div>
      </div>

      <div class="sec">
        <div class="row-lbl"><span class="lbl">文字サイズ</span><span class="val">18sp</span></div>
        <div class="slider">
          <span class="end" style="font-size:14px">あ</span>
          <span class="track"><span class="fill" style="width:40%"></span><span class="knob" style="left:40%"></span></span>
          <span class="end" style="font-size:24px">あ</span>
        </div>
      </div>

      <div class="sec">
        <div class="row-lbl"><span class="lbl">行間</span><span class="val">2.5</span></div>
        <div class="slider">
          <span class="end g">狭</span>
          <span class="track"><span class="fill" style="width:40%"></span><span class="knob" style="left:40%"></span></span>
          <span class="end g">広</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
