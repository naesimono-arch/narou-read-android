plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // なぜ parcelize: 発見系の画面状態（ResultContext・DiscoveryQuery・SearchDraft）を SavedStateHandle へ
    // 退避して process death 復帰させるため（F-C/F-E）。Set<enum> や入れ子 data class を含むため手書き
    // シリアライズは分岐が多く退行しやすい。@Parcelize なら構造追従が自動で、フィールド追加時の更新漏れも防げる。
    id 'org.jetbrains.kotlin.plugin.parcelize'
    // Compose コンパイラ（KGP 2.x 必須）。Kotlin 2.0 で Compose コンパイラが Kotlin リポジトリへ移管され、
    // composeOptions.kotlinCompilerExtensionVersion による独立採番の指定は廃止＝本プラグインが正規の供給経路。
    // 版は settings.gradle で Kotlin 本体と揃えて宣言する（ズレると即ビルド破綻）。
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    // Roborazzi: 葉 Composable のスクリーンショット回帰（テーマ退行・トークン波及・フォントスケール破綻の機械検知）。
    // recordRoborazziDebug / verifyRoborazziDebug タスクを供給する（ADR 0009 増補1）。
    id 'io.github.takahirom.roborazzi'
    // ktlint: 未使用 import の機械検知（設定は下の ktlint ブロック＋リポジトリ直下 .editorconfig）。
    // :app のみに適用する（未使用 import は全て :app 側。:macrobenchmark は実機計測専用の小モジュールで
    // 適用するにはルートの build.gradle を触る必要があり、本便の作業範囲外）。
    id 'org.jlleitschuh.gradle.ktlint'
}

// ktlint の設定。ルールの取捨はリポジトリ直下 .editorconfig が正本（ktlint 0.48+ では
// disabledRules プロパティが廃止され .editorconfig が唯一の指定手段のため）。
ktlint {
    // 明示ピン必須: プラグイン 12.3.0 の既定は ktlint 1.0.1 と古い。1.5.0 は 12.3.0 の
    // KtLintSupportedVersionsTest が実際に通している最新版＝プラグインと組み合わせた実績がある。
    version = '1.5.0'
    // Android の慣習（Kotlin 公式 style ではなく android_studio style）を基準にする。
    // 現状は .editorconfig で標準ルールセットを一括 disabled にしているため実効差は無いが、
    // 将来ルールを開けるときに Kotlin 公式 style の指摘が一斉に出るのを防ぐ意図で先に宣言しておく。
    android = true
    // 違反があればタスクは落とす（＝レポートを正直に赤にする）。CI 側の初回非ブロック化は
    // .github/workflows/ci.yml の continue-on-error で行う——ここで握り潰すと
    // 「掃除が終わってもゲートが効いていない」状態に気づけなくなるため、握り潰す側を CI に寄せる。
    ignoreFailures = false
    filter {
        // 生成コード（BuildConfig・Room/Moshi の KSP 出力等）は対象外。人が直せない指摘でノイズになるうえ、
        // KSP 生成物は AGP が Kotlin の source set に足すので黙っていると lint 対象に入ってしまう。
        // なぜ buildDir 絶対パスでなく "/generated/" 判定か: canonical ビルドは init スクリプトで buildDir を
        // ext4 へ退避するため buildDir の位置が環境で変わる。生成物は退避先でも .../generated/... に出るので
        // パスの一区画で判定する方が環境非依存。src 配下に generated を含む実パスが無いことは確認済み（誤除外なし）。
        // クロージャ内で Project の API を触らない＝configuration-cache（本プロジェクトは既定 ON）でも安全。
        exclude { it.file.absolutePath.replace('\\', '/').contains('/generated/') }
    }
}

// 大PDF取込ベンチ用に、追跡済みの実PDF 1本(N6169DZ.pdf)だけを benchmark の assets へコピーするタスク。
// なぜ assets 同梱方式か（push 方式が Android 11+ で不成立）: Android 11+ は /sdcard/Android/data への adb push が
// 不可・/data/local/tmp は SELinux で app 側から読めない＝「実PDF をアプリに読ませる」取込ベンチが push では成立しない。
// benchmark variant 限定なので出荷 APK（debug/release）は不変。sample_pdfs を丸ごと assets にせず N6169DZ.pdf 1本だけを
// copy し、他 PDF が APK に混入しないようにする（サイズ・攻撃面の抑制）。
//
// なぜ標準の Copy タスク＋sourceSets.assets.srcDir(TaskProvider) ではないか（2026-08-06 の潜伏バグ修理）:
// AGP は android{} ブロック（DSL 評価時）に積まれた srcDir を variant 生成時に
// DefaultSourcesProviderImpl.getSourceList → DefaultAndroidSourceDirectorySet.getSrcDirs()＝
// project.files(...).getFiles() で**素の Set<File> に潰してから** FileBasedDirectoryEntryImpl（静的
// ディレクトリ・生産者情報なし）へ包む。TaskProvider を渡しても builtBy がここで脱落するため、
// copyBenchmarkPdfAsset は assembleBenchmark のタスクグラフに一切乗らず、build ディレクトリが
// 白紙だと PDF 無しの APK が黙って出来上がる（AGP 8.6.1/8.9.1/8.10.1 のバイトコードで同一実装を
// 確認済み＝バージョン非依存。過去に成功して見えたのは build 残存物による偶発）。
// 正当な結線は variant API の addGeneratedSourceDirectory（下の androidComponents ブロック）一択で、
// これは TaskProviderBasedDirectoryEntryImpl を作り mergeAssets だけでなく lintVitalAnalyzeBenchmark 等
// 「この assets を読む全タスク」へ依存を自動配線する（手動 dependsOn の網羅が原理的に漏れる問題も解消）。
// Copy タスクをやめて専用クラスにするのは、addGeneratedSourceDirectory が「AGP が出力先を注入できる
// DirectoryProperty」を要求するのに対し Copy の destinationDir は素の File で注入を受けられないため。
abstract class CopyBenchmarkPdfAssetTask extends DefaultTask {
    @PathSensitive(PathSensitivity.NONE)
    @InputFile
    abstract RegularFileProperty getSourcePdf()

    // 出力先は addGeneratedSourceDirectory が build/generated/... 配下へ注入する（自前で set しない）
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copyPdf() {
        // asset エントリを sample_pdfs/N6169DZ.pdf にする（ImportBenchReceiver の open パスと一致）
        File destDir = new File(outputDir.get().asFile, 'sample_pdfs')
        destDir.mkdirs()
        File src = sourcePdf.get().asFile
        java.nio.file.Files.copy(src.toPath(), new File(destDir, src.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def copyBenchmarkPdfAsset = tasks.register('copyBenchmarkPdfAsset', CopyBenchmarkPdfAssetTask) {
    // rootProject.projectDir = android/（settings.gradle の位置）。sample_pdfs はリポジトリ直下＝android/../sample_pdfs。
    sourcePdf = rootProject.file('../sample_pdfs/N6169DZ.pdf')
}

// リリース署名の資格情報は local.properties（gitignore 済み）から読む。鍵ファイル自体はリポジトリ外に置き、
// ここには絶対パスだけが書かれる（`~` は展開されないので storeFile は絶対パスで指定すること）。
// なぜこの分離か: 鍵とパスワードをリポジトリへ一切入れないため（漏洩したら upload key の差し替えが要る）。
// なぜ「鍵が無ければ未署名で通す」か: 鍵を持たない環境（別 worktree・引き継ぎ直後・将来の CI）でも
// assembleRelease/bundleRelease が構成エラーで落ちず、署名の有無だけが変わるようにするため。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def hasReleaseKeystore = localProps['release.storeFile'] != null

android {
    namespace 'com.novelreader'
    // compileSdk 36・targetSdk 36: Google Play の新規アプリ向け targetSdk 要件に合わせた公開準備の移行（2026-07-29）。
    // 34→36 は 35 の挙動変更も一度に受ける（edge-to-edge 強制・predictive back 既定 ON）。
    // 天井が外れて据え置いていた依存（lifecycle/work/Compose BOM 等）は 2026-07-30 に一括バンプ済み。
    // その後の上限だった **Kotlin 1.9.22** も 2026-08-05 の1便で 2.2.21 へ移行し解消（ADR 0029）。
    // 現在の上限は AGP 8.10.1 / Gradle 8.11.1 側＝各依存と settings.gradle のコメント参照。
    compileSdk 36

    defaultConfig {
        applicationId "com.novelreader"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0" // 採番規約＝ADR 0025（案A: versionCode 通し連番×versionName semver 風）

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        // upload keystore（Play App Signing のアップロード鍵）。資格情報の出所は冒頭コメント参照。
        // 鍵が無い環境ではこのブロック自体を作らない＝未定義の signingConfig を参照させない。
        if (hasReleaseKeystore) {
            release {
                storeFile file(localProps['release.storeFile'])
                storePassword localProps['release.storePassword']
                keyAlias localProps['release.keyAlias']
                keyPassword localProps['release.keyPassword']
            }
        }
    }

    buildTypes {
        // ── 公開スコープ機能ゲート SKIN_SWITCHING_ENABLED（ADR 0027）──
        // スキン軸（装いの間・設定「きせかえ」行・保存値の復元）を外へ出すか。初回公開は明快K 単独＝release は false。
        // なぜ defaultConfig に既定値を置かず buildType ごとに書くか: defaultConfig に true を置くと、将来足した
        // buildType が黙って true を継承する＝公開系の派生ビルドで温存中の装いが漏れても誰も気づかない。
        // buildType ごとの明示なら、宣言を書き忘れた新 buildType は BuildConfig にフィールドが生えず
        // 参照側（Features）がコンパイルエラーで落ちる＝漏れる代わりに気づける側へ倒す。
        debug {
            buildConfigField 'boolean', 'SKIN_SWITCHING_ENABLED', 'true'
        }
        release {
            // 鍵を持つ環境でだけ署名する。無い場合は未署名成果物になる＝Play へ上げる前に必ず鍵の配置が要る。
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            buildConfigField 'boolean', 'SKIN_SWITCHING_ENABLED', 'false'
            // R8 収縮＋難読化＋リソース削減。keep はライブラリ同梱の consumer ルールを
            // 前提に不足分だけ proguard-rules.pro へ書く（設計根拠は同ファイル冒頭コメント）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        benchmark {
            // initWith は release の buildConfigFields ごと写す＝SKIN_SWITCHING_ENABLED=false も継承される
            // （計測構成を公開構成と一致させる＝ADR 0027 決定1）。実測で確認済み（generateBenchmarkBuildConfig の出力）。
            initWith release
            // 実機で野良ビルドを直接インストールできるよう debug 署名を使う
            signingConfig signingConfigs.debug
            // 実蔵書(com.novelreader)と別アプリとして共存させ、計測用データ投入で
            // ユーザーの蔵書DBを壊さないための別パッケージ化
            applicationIdSuffix ".benchmark"
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        // BuildConfig 生成を明示 ON（AGP 8.x は既定 OFF）。高負荷スカイ試作トグルを debug ビルド限定で
        // 露出するため BuildConfig.DEBUG を参照する（ADR 0023・release では常に false 扱い）。
        // 公開スコープ機能ゲート SKIN_SWITCHING_ENABLED（ADR 0027・上の buildTypes）も同じ生成物に載る。
        buildConfig true
    }
    testOptions {
        unitTests {
            returnDefaultValues true
            // Robolectric + Compose UI テスト（葉 Composable の semantics 検証）に必須。
            // includeAndroidResources=false のままだと Robolectric が merged manifest/リソースを
            // 読めず createComposeRule が起動時に落ちるため。純JVMテスト（PDF/parser 等）には無影響。
            includeAndroidResources true
        }
    }
    sourceSets {
        // Room の schemaLocation 出力（git 管理済み JSON）を androidTest から MigrationTestHelper で
        // 読めるようにする。過去版スキーマを assets として同梱しないと migration テストが書けない。
        // （benchmark の実PDF assets はここに書かない: DSL の srcDir は TaskProvider の依存を運べない＝
        //   経緯と機序は上の CopyBenchmarkPdfAssetTask のコメント。結線は下の androidComponents ブロック）
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        // ── 16KB ページ要件の確認手順（依存バンプのたびに実施すること）──
        // なぜ設定ではなく手順か: 本モジュールは自前 jniLibs を持たないので「ここに書けば直る」設定が無い。
        // それでも Compose(ui/graphics) と datastore 由来の .so が 4ABI×2＝8 本入るため、依存を上げると
        // 上流が同梱する .so が差し替わり、16KB 非対応の版が紛れ込みうる（Android 15+ の 16KB ページ端末で
        // 起動不能になる）。AGP 任せにできないのはこの「上流由来」の性質ゆえ＝バンプのたびに人が見る。
        //
        //   前提: release APK を先に作る（./gradlew :app:assembleRelease）。zipalign の -P は
        //         build-tools 35.0.0 以降のみ対応（34.0.0 には無い）。NDK 未導入のため ELF 検分は OS の readelf を使う。
        //
        //   ① APK 内の .so が 16KB 境界に zip 整列しているか
        //      ~/Android/Sdk/build-tools/35.0.0/zipalign -c -P 16 -v 4 \
        //        app/build/outputs/apk/release/app-release-unsigned.apk | tail -1
        //      → 最終行が "Verification succesful"（sic: Android 側の綴り）かつ exit 0 なら合格
        //
        //   ② .so 自身の ELF LOAD セグメントが 16KB 単位か（p_align）
        //      python3 -m zipfile -e app/build/outputs/apk/release/app-release-unsigned.apk /tmp/apkx
        //      find /tmp/apkx/lib -name '*.so' -exec readelf -lW {} + | awk '/LOAD/{print $NF}' | sort -u
        //      → 出力が 0x4000 のみなら合格。0x1000 が混ざったらその .so を持つ依存が非対応＝バンプを戻す
        //
        //   ①②は別物なので両方要る（①は APK 内の配置・②は .so 自身の作り。①だけ通っても②が 0x1000 なら実機で落ちる）。
        //   実測値: 2026-07-30 時点の release APK は .so 8 本すべて 0x4000・① も合格。
    }
}

// benchmark variant の assets へ実PDF コピーの出力を「タスク依存ごと」結線する。
// なぜ variant API か・なぜ DSL の sourceSets.assets.srcDir(TaskProvider) では駄目か＝
// 上の CopyBenchmarkPdfAssetTask のコメント参照（DSL 経路は builtBy が脱落しグラフに乗らない）。
// addGeneratedSourceDirectory は AGP が出力先（build/generated/assets/...）を outputDir へ注入し、
// TaskProviderBasedDirectoryEntryImpl 経由で mergeBenchmarkAssets・lintVitalAnalyzeBenchmark 等の
// 消費側全部へ依存を自動配線する（variant API 7.x〜 の安定APIで AGP 8.6/8.9/8.10 いずれでも同挙動）。
androidComponents {
    onVariants(selector().withBuildType('benchmark')) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(copyBenchmarkPdfAsset, { it.outputDir })
    }
}

// Compose コンパイラの設定（KGP 2.x の compose plugin 拡張）。
// 旧構成では kotlinOptions.freeCompilerArgs へ `-P plugin:androidx.compose.compiler...` を直渡ししていたが、
// プラグイン移行後は -P 直渡しが二重指定になり得るため本 DSL が唯一の指定手段。
//
// ⚠ strong skipping について（旧 experimentalStrongSkipping=true の後継＝設定を消したのは無効化ではない）:
// 本プロジェクトは検索画面のチップ再コンポーズ負荷を下げる目的で strong skipping を明示 ON にしていた
// （unstable パラメータを持つ restartable Composable も skippable になり、ラムダは捕捉値ベースで自動 remember
//  される）。Kotlin 2.0.20 以降 strong skipping は**既定 ON**になり、旧来の実験フラグは廃止された。
// つまり指定を消しても挙動は維持される（むしろ既定で有効）＝OFF に倒すなら
// featureFlags に ComposeFeatureFlag.StrongSkipping.disabled() を明示する必要がある。ここでは既定のままにする。
composeCompiler {
    // Compose compiler の stability/skippability レポート出力。
    // なぜオプトイン(-PcomposeCompilerReports=true): 常時出力はビルド時間を無駄に増やすため、
    // skippable 化の機械検証をしたいときだけ有効化する。
    // layout.buildDirectory 経由なので canonical ビルドの ext4 退避 buildDir にも追従する。
    if (project.findProperty('composeCompilerReports') == 'true') {
        reportsDestination = layout.buildDirectory.dir('compose_compiler')
        metricsDestination = layout.buildDirectory.dir('compose_compiler')
    }
}

// Room スキーマ JSON の出力先（git 管理対象: android/app/schemas/）
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // なぜ明示 1.4.1: 推移解決の 1.3.1 は SDK 分岐が閉じた switch（〜34）で、Android 16(SDK 36) 実機だと
    // ベースラインプロファイル注入が RESULT_UNSUPPORTED_ART_VERSION になり Macrobenchmark
    // （CompilationMode.DEFAULT）が走れない。1.4.1 は SDK>=31 を上限なしで V015_S 扱い（bytecode 検分済み）
    // かつ minCompileSdk=34 なので現構成（compileSdk 36）でもそのまま解決できる。実利用でも初回起動のプロファイル注入が直る。
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    // Perfetto トレース区間（androidx.tracing.trace）。取込パイプラインのフェーズを Macrobenchmark の
    // TraceSectionMetric で計測するために使う（挿入は Sections ラッパー経由＝JVM 単体テストは no-op で巻き込まない）。
    // なぜ tracing-ktx ではなく tracing（2026-08-05・Kotlin 2.x 化と同便で据え置きを解消）:
    // 唯一の利用箇所である trace/Sections.kt は `androidx.tracing.Trace.beginSection/endSection`
    // という **Java の static メソッド**だけを呼んでおり、ktx が足す唯一の API である
    // `androidx.tracing.trace { }` 拡張関数は使っていない（同ファイルの KDoc が「ktx の trace は block が
    // crossinline のため suspend 呼び出しを通せない」＝意図的に使わない理由を記録している）。
    // よって ktx 側は不要＝基底 artifact だけで足りる。1.3.0 では tracing-ktx が classes.jar 空の shim になり
    // 実体が tracing-android へ移るため、ktx 座標のまま上げると「空の shim を宣言している」状態になり読み違いを招く。
    // 版 1.3.0 は Kotlin 2.0 ビルド（mv=2.0.0）で、KGP 1.9.22 時代は AndroidX が「KGP 2.0.0+ でのみ消費可」と
    // 明言していたため据え置いていた（ADR 0029 の残り1件）。本便で KGP 2.2.21 になり前提が解消した。
    // 挿入コード自体は main（全 variant）に入るが android.os.Trace 可用性判定で
    // 実機のみ発行され、出荷挙動は不変（トレース捕捉が無ければネイティブ側で軽い no-op）。
    implementation 'androidx.tracing:tracing:1.3.0'
    // JankStats: 実利用でのフレーム落ちを画面別に自己計測する（com.novelreader.diagnostics）。
    // なぜ Macrobenchmark と別に要るか: Macrobenchmark は「手元で決まった操作を測って予算を守る」回帰装置で、
    // 実機を日常使いしてもらったときにどの画面が落ちるかは測れない。JankStats は実行中のアプリ自身が
    // フレーム時間を拾うため、手元で再現できない体感ジャンク（2026-07-24 報告）に実測で当たれる。
    // なぜ 1.0.0-beta02: 本ライブラリの安定版は未リリースで beta が実質の最新系列。API は
    // createAndTrack + PerformanceMetricsState の2点のみで、収集を止めれば影響も消える薄い依存。
    implementation 'androidx.metrics:metrics-performance:1.0.0-beta02'
    // lifecycle 群の版は 3 依存（runtime-ktx / runtime-compose / process）で必ず揃える。
    // なぜ 2.8.7 が上限か（2026-07-30 に 2.6.2 から引き上げ）: 2.9.0-beta01 のリリースノートが
    // 「This library now targets Kotlin 2.0 language level and requires KGP 2.0.0 or newer.」と明言しており、
    // 実artifactも 2.9.x 以降は @Metadata mv=2.0.0 / kotlin-stdlib 2.0.21 依存になる（本プロジェクトは KGP 1.9.22）。
    // 2.8.7 は kotlin-stdlib 1.8.22 依存・mv 1.8.0・minCompileSdk 34 で現構成のまま解決できる。
    // 加えて Compose 1.8.3（compose-bom 2025.07.00）の ui が lifecycle-runtime-compose/viewmodel 2.8.7 を
    // 推移要求するため、2.8.7 を明示宣言すると「宣言値＝解決値」になり版ズレの読み違いが起きない。
    // 注意: 2.8.x で lifecycle-runtime-ktx の aar は classes.jar 空の shim になり、実体（RepeatOnLifecycleKt 等）は
    // 推移する lifecycle-runtime-android へ移動している。本座標を消すと推移経路ごと消えるので残すこと。
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    // U1 新着話チェックの定期実行（24h 周期・ネットワーク制約）。
    // なぜ 2.10.5（2026-07-30 に 2.9.1 から引き上げ・2.10 系の最終パッチ）: work-runtime 2.10.5 は
    // @Metadata mv=1.8.0 / kotlin-stdlib 1.8.22 依存で Kotlin 1.9.22 のまま解決でき、minCompileSdk 35 も
    // compileSdk 36 化で満たす。2.11.x へ行かない理由は mv=2.1.0 / kotlin-stdlib 2.1.20＝Kotlin 1.9.22 の
    // 受理上限（JvmMetadataVersion.INSTANCE_NEXT=2.0.0）を超え、コンパイル時にメタデータ非互換で確実に落ちるため。
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    // collectAsStateWithLifecycle 提供。ライフサイクル STOPPED 以下で StateFlow の collect を止め、
    // バックグラウンドでの無駄な購読/再コンポーズを避ける（従来の collectAsState は常時 collect）。
    // 版は lifecycle-runtime-ktx と揃える（上限 2.8.7 の根拠は同依存のコメント）。
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    // ProcessLifecycleOwner 提供（アプリ全体の前面/背面判定）。変換完了通知の二重報告抑止に使う
    // （UX監査 notify §86）。版は他の lifecycle 群と揃える（上限 2.8.7 の根拠は lifecycle-runtime-ktx のコメント）。
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    // なぜ 1.8.2（2026-07-31 に 1.8.1 から「宣言を実態へ」揃えた）:
    // material3-android 1.3.2 が activity-compose 1.8.2 を直に要求しており、加えて androidx.activity は
    // atomic group（activity / activity-ktx / activity-compose が同版で動く）ため、1.8.1 と宣言しても
    // 実際には conflict resolution で 1.8.2 が選ばれていた（実測＝dependencyInsight の Selection reasons
    // "By constraint: activity-ktx is in atomic group androidx.activity" ＋ "By conflict resolution:
    // between versions 1.8.2, 1.8.1 and 1.7.0"）。宣言値と解決値がズレたままだと版の読み違いを招くので揃える。
    // これは版上げではなく**宣言の実態合わせ**＝解決される版はどの座標も変わらない（実測: :app:dependencies の
    // 差分は本宣言行が `1.8.1 -> 1.8.2` から `1.8.2` になるだけで、版が動いた座標は 0）。だから ADR 0029 の
    // 「Kotlin 1.9.22 天井・次は1便」とは独立に入れられる（同 ADR も本座標を「天井とは無関係」と記録している）。
    implementation 'androidx.activity:activity-compose:1.8.2'
    // なぜ 2025.07.00（2026-07-30 に 2025.02.00 から引き上げ）= Compose 1.8.3 / material3 1.3.2:
    // **Kotlin 1.9.22＋kotlinCompilerExtensionVersion 1.5.10 で使える最後の BOM**。
    //   ・上げられる理由: 1.8 系を阻んでいたのは minCompileSdk 35 で、compileSdk 36 化（2026-07-29）で解消。
    //     Compose 1.8.3 の実artifact（ui/ui-graphics/foundation/ui-tooling）は @Metadata mv=1.9.0・
    //     kotlin-stdlib 1.9.24 依存＝Kotlin 1.9.22 のまま解決できる。生成コードが呼ぶ runtime 側 API
    //     （sourceInformation(MarkerStart/End)・traceEventStart/End・isTraceInProgress）は 1.7.8 と同一で、
    //     Compose コンパイラの VersionChecker は runtime の**下限**しか見ない＝1.5.10 の生成コードと組める。
    //   ・上げない理由（2025.08.00 以降＝Compose 1.9.0+）: mv=2.0.0 / kotlin-stdlib 2.0.21 になり、
    //     AndroidX が「Kotlin 2.0 で出した版は KGP 2.0.0+ でのみ消費可」と明言している。1.11.x に至っては
    //     mv=2.1.0 で Kotlin 1.9.22 の受理上限（INSTANCE_NEXT=2.0.0）を超え確実に落ちる。
    //     BOM をこれ以上上げるには Kotlin 2.x 化が先＝ただし Kotlin 1.9.22 は Roborazzi 1.30.1 との連鎖で
    //     固定されている（settings.gradle 参照）ので、Compose・Kotlin・Roborazzi は 1 便でまとめて上げること。
    //   ・案B（削除時の詰め直しアニメ）に必要な Modifier.animateItem() は foundation 1.7.0+ で、1.8.3 でも健在。
    // ⚠️ BOM を動かしたら 16KB ページ整列の再確認が要る（手順は上の packagingOptions ブロックのコメント）。
    //    Compose・datastore 由来の .so が 4ABI×2＝8 本入るため、自前 jniLibs が無くても影響を受ける。
    implementation platform('androidx.compose:compose-bom:2025.07.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // HTMLパーサー (Jsoup)
    implementation 'org.jsoup:jsoup:1.17.2'

    // なぜ: List<TextSegment> は Compose stability 推論で不安定→読書 LazyColumn の項目が skippable にならないため。
    // 導入時（2026-07-08）は strong skipping が無効で、これが skippable 化の唯一の手段だった。
    // その後 2026-07-11 に kotlinOptions で experimentalStrongSkipping=true を有効化しており（上記参照）、
    // 「strong skipping 無効の環境だから要る」という当初の理由は現在は成立しない＝旧コメントを 2026-07-30 に是正。
    // なお strong skipping 有効下でも本依存は無害で、ImmutableList は「unstable 引数の等値比較に頼らず
    // 安定と宣言できる」点で今も意味を持つ。要否の再判定（外せるか）は composeCompilerReports で
    // skippable 状態を実測してから行うこと＝憶測で外すと LazyColumn の再コンポーズが静かに増える。
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'

    // PDF抽出 (PDFBox-Android / Tom Roush 版)。旧 Chaquopy(Python+pdfminer) から移植した唯一の抽出経路。
    // なぜ 2.0.x 系で固定: Android 版 PDFBox-Android は upstream apache-pdfbox 2.0.x をベースにしており、
    // 移植元プロト (ab-review/submission-B) が apache 2.0.31 で精度検証済みのため API を 1:1 に保てる。
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // データベース (Room)
    // ── なぜ 2.8.4（2026-08-05・Kotlin 2.x 便で 2.6.1 から移行。これは「ついで」ではなく必須の連鎖）──
    // Kotlin 2.2.x には KSP1 が存在せず KSP2 しか無い（KSP1 の `-1.0.x` は 2.1.20 で打ち止め）。
    // ところが Room 2.6.1 の XProcessing は KSP2 が返す void の JVM シグネチャ `V` を解釈できず、
    // DAO の Unit 返却メソッドを処理する時点で `IllegalStateException: unexpected jvm signature V` を投げて
    // kspDebugKotlin が落ちる（本ブランチで実測）。つまり Kotlin 2.x 化は Room の引き上げを強制する。
    // 2.7.0 が KSP2 対応の最初の版＝公式リリースノートの明示（"Support for KSP2 is also added and is
    // recommended when using Room with Kotlin 2.0 or higher." / "Room now targets Kotlin language 2.0"）。
    // その中で最新安定の 2.8.4 を採るのは、room-compiler 2.8.4 の POM が要求する kotlin-stdlib が 2.2.0＝
    // 本便の KGP 2.2.21 と同系列で、メタデータ受理上限の齟齬が構造的に起きないため（2.7.x は 2.0 系ビルド）。
    // 2.8 系の追加要件は minSdk 23（本プロジェクト 26）と「Room Gradle Plugin を使う場合の AGP 8.4+」
    // （本プロジェクトは Room Gradle Plugin を使わず上の ksp { arg(room.schemaLocation) } 方式なので AGP 要件は
    //  そもそも掛からない。掛かったとしても現行 AGP は 8.4 より新しい＝settings.gradle 参照）＝いずれも充足。
    // 版を上げるとスキーマ JSON の**書式だけ**変わる（Room 2.7+ が既定値を出力しなくなり notNull:false と
    // 空の indices/foreignKeys/views が消える）。identityHash・createSql・列定義は不変であることを照合済み＝ADR 0029 増補1。
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    // room-ktx は 2.7.0 で room-runtime へ統合され空 artifact になった（公式: "the artifact is now blank.
    // Please remove it from your dependency list."）。唯一の利用 API である androidx.room.withTransaction は
    // room-runtime 側に移っているので、宣言を消しても呼び出し側は無変更で解決される。
    ksp "androidx.room:room-compiler:$room_version"

    // なろう公式API ディスカバリ (メタデータ取得のみ・本文は扱わない)。HTTP=Retrofit/OkHttp, JSON=Moshi codegen。
    // なぜ Moshi codegen: 既存の Room 用 KSP に相乗りでき settings.gradle 変更不要。かつ moshi-kotlin(リフレクション版)を
    // 避けることで kotlin-reflect(約3MB) の混入を防ぐ。R8 収縮を有効化した現在もこの選択は有効——
    // リフレクション版は kotlin-reflect ごと広範な keep が必要になり収縮効果を殺すのに対し、
    // codegen は proguard-rules.pro の生成アダプタ keep 2行で済む（Class.forName 解決のため keep 必須）。
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // User-Agent インターセプタ用に版を明示固定

    // 検索履歴＋ピン留め（発見機能 D1）のローカル永続。蔵書 Room を汚さない軽量ストア。
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Custom Tabs（外部Web導線＝なろう作品/話ページをアプリ内オーバーレイ表示）。
    // なぜ WebView ではなく Custom Tabs か: 「アプリで完結」方針を、WebView の保守負担・
    // 規約リスク（本アプリは意図的に WebView を捨ててネイティブ化した経緯がある）を負わずに満たすため。
    // launchUrl の暗黙 ACTION_VIEW のみ使用しサービスバインドはしないため <queries> 追加は不要。
    implementation 'androidx.browser:browser:1.8.0'

    // In-App Review（Play ストアの評価打診シート）。読了の瞬間（reachedEnd false→true 遷移）にのみ呼ぶ。
    // なぜ -ktx 版: requestReview()/launchReview() の suspend 拡張で Task コールバックの入れ子を避ける
    // （実装は review/ReviewPrompter.kt）。ReviewManager は Play 開発者サービス必須＝JVM テストでは
    // ReviewPrompter インターフェースのフェイクで代替し、実表示の確認は内部テストトラックで行う。
    implementation 'com.google.android.play:review-ktx:2.0.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.10'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    // 葉 Composable の UI テストを JVM（Robolectric）で回すための基盤（ADR 0009）。
    // なぜ androidTest ではなく Robolectric か: 実機不要で testDebugUnitTest ゲートに同乗でき、
    // ColorOS の freeze/kill 問題（task_diary #36-38）を避けられるため。
    // 版固定 4.11.1（targetSdk 36 化後も据え置ける根拠）: 本プロジェクトの Robolectric テストは全ファイルが
    // @Config(sdk = [34]) で実行時 SDK を明示固定しており、既定の「merged manifest の targetSdk を使う」経路に
    // 乗らない＝targetSdk 36 化しても 4.11.1 のサポート上限（SDK 34）を超えない。
    // 裏返しの制約: JVM テストは SDK 34 の挙動しか見ない。targetSdk 35/36 固有の実行時変化（edge-to-edge 強制など）は
    // ここでは絶対に捕まらず実機検証が要る。SDK 35+ を JVM で見たくなった時点で Robolectric 側のバンプが先に必要。
    testImplementation 'org.robolectric:robolectric:4.11.1'
    // Retrofit の実 URL エンコード（日本語 word の percent-encoding・of/order 等）を実リクエストで検証するため。
    // 版は okhttp 4.12.0 と同系で固定（MockWebServer は OkHttp 同梱物）。
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // BOM 管理下なので ui-test の版指定は不要（compose-bom が解決）。版は implementation 側の BOM と必ず揃える
    // ——揃えないと本番と test でコンパイル対象の Compose が食い違い、Roborazzi の golden が理由不明にズレる。
    testImplementation platform('androidx.compose:compose-bom:2025.07.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // createComposeRule が起動する ComponentActivity の宣言を unit test の manifest に供給する。
    // debugImplementation 側にも在るが、testDebugUnitTest のクラスパスへ確実に載せるため明示追加。
    testImplementation 'androidx.compose.ui:ui-test-manifest'
    // Roborazzi スクリーンショットテスト（ADR 0009 増補1）。版は Roborazzi プラグインと一致させる（1.70.0）。
    // roborazzi=キャプチャ/比較の中核、roborazzi-compose=onRoot().captureRoboImage 等 Compose 拡張、
    // roborazzi-junit-rule=RoborazziRule（本実装では未使用だが将来の自動命名運用に備え依存だけ入れる）。
    // 選定根拠は settings.gradle のプラグイン宣言側コメント（Kotlin 2.2.21 との整合・golden 100枚が無変化だった実測）。
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.70.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.70.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.70.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Room migration の実機検証（MigrationTestHelper）。identity hash 起因の起動即クラッシュを
    // 2度実測したプロジェクトのため（task_diary #39）、「実機で踏む」を「テストで捕まえる」に変える。
    androidTestImplementation "androidx.room:room-testing:$room_version"
    // 版は implementation 側の BOM と揃える（上のコメント参照）
    androidTestImplementation platform('androidx.compose:compose-bom:2025.07.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}