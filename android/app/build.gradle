plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // なぜ parcelize: 発見系の画面状態（ResultContext・DiscoveryQuery・SearchDraft）を SavedStateHandle へ
    // 退避して process death 復帰させるため（F-C/F-E）。Set<enum> や入れ子 data class を含むため手書き
    // シリアライズは分岐が多く退行しやすい。@Parcelize なら構造追従が自動で、フィールド追加時の更新漏れも防げる。
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'com.google.devtools.ksp'
    // Roborazzi: 葉 Composable のスクリーンショット回帰（テーマ退行・トークン波及・フォントスケール破綻の機械検知）。
    // recordRoborazziDebug / verifyRoborazziDebug タスクを供給する（ADR 0009 増補1）。
    id 'io.github.takahirom.roborazzi'
}

// benchmark variant の assets へ載せる実PDF（追跡済み・約8.5MB の N6169DZ.pdf）の中間出力先。
// layout.buildDirectory 経由なので canonical ビルドの ext4 退避 buildDir にも追従する（composeCompilerReports と同流儀）。
def benchmarkPdfAssetsDir = layout.buildDirectory.dir('generated/benchmarkPdfAssets')

// 大PDF取込ベンチ用に、追跡済みの実PDF 1本(N6169DZ.pdf)だけを benchmark の assets 中間ディレクトリへコピーする。
// なぜ assets 同梱方式か（push 方式が Android 11+ で不成立）: Android 11+ は /sdcard/Android/data への adb push が
// 不可・/data/local/tmp は SELinux で app 側から読めない＝「実PDF をアプリに読ませる」取込ベンチが push では成立しない。
// benchmark variant 限定なので出荷 APK（debug/release）は不変。sample_pdfs を丸ごと srcDir にせず N6169DZ.pdf 1本だけを
// copy し、他 PDF が APK に混入しないようにする（サイズ・攻撃面の抑制）。
// destinationDir は中間ディレクトリのルート・子 spec の into('sample_pdfs') で asset エントリを
// sample_pdfs/N6169DZ.pdf にする（ImportBenchReceiver の open パスと一致）。ルートを出力にするのは、
// この TaskProvider を下の sourceSets.benchmark.assets.srcDir へそのまま渡すため（出力＝srcDir の根を一致させる）。
def copyBenchmarkPdfAsset = tasks.register('copyBenchmarkPdfAsset', Copy) {
    // rootProject.projectDir = android/（settings.gradle の位置）。sample_pdfs はリポジトリ直下＝android/../sample_pdfs。
    from(rootProject.file('../sample_pdfs/N6169DZ.pdf')) {
        into 'sample_pdfs'
    }
    into benchmarkPdfAssetsDir
}

android {
    namespace 'com.novelreader'
    // compileSdk 36・targetSdk 36: Google Play の新規アプリ向け targetSdk 要件に合わせた公開準備の移行（2026-07-29）。
    // 34→36 は 35 の挙動変更も一度に受ける（edge-to-edge 強制・predictive back 既定 ON）。
    // 依存（lifecycle/work/Compose BOM 等）のバンプは動作検証と別便で行う（天井が外れただけで版は据え置き）。
    compileSdk 36

    defaultConfig {
        applicationId "com.novelreader"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            // R8 収縮＋難読化＋リソース削減。keep はライブラリ同梱の consumer ルールを
            // 前提に不足分だけ proguard-rules.pro へ書く（設計根拠は同ファイル冒頭コメント）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        benchmark {
            initWith release
            // 実機で野良ビルドを直接インストールできるよう debug 署名を使う
            signingConfig signingConfigs.debug
            // 実蔵書(com.novelreader)と別アプリとして共存させ、計測用データ投入で
            // ユーザーの蔵書DBを壊さないための別パッケージ化
            applicationIdSuffix ".benchmark"
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // Compose 強い skipping（strong skipping）を有効化する。
        // なぜ freeCompilerArgs の -P 直渡しか: 本プロジェクトは Kotlin 1.9.22＋composeOptions の
        // kotlinCompilerExtensionVersion 1.5.10 構成（Kotlin 2.0 の compose plugin ではない）。この構成では
        // strong skipping は既定 OFF の実験機能で、Compose Compiler プラグインへ experimentalStrongSkipping を
        // 直接渡して有効化する（Kotlin 2.0.20+ のような既定 ON ではない）。
        // なぜ有効化するか: unstable パラメータを持つ restartable Composable も skippable になり、@Immutable 化した
        // SearchDraft/SearchFilters と併せて検索画面のチップ再コンポーズ負荷を下げる。ラムダは捕捉値ベースで自動 remember される。
        freeCompilerArgs += ['-P', 'plugin:androidx.compose.compiler.plugins.kotlin:experimentalStrongSkipping=true']
        // Compose compiler の stability/skippability レポート出力。
        // なぜオプトイン(-PcomposeCompilerReports=true): 常時出力はビルド時間を無駄に増やすため、
        // skippable 化の機械検証をしたいときだけ有効化する（従来は検証手段ゼロだった）。
        // layout.buildDirectory 経由なので canonical ビルドの ext4 退避 buildDir にも追従する。
        if (project.findProperty('composeCompilerReports') == 'true') {
            def dest = project.layout.buildDirectory.dir('compose_compiler').get().asFile.absolutePath
            freeCompilerArgs += ['-P', "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=${dest}".toString(),
                                 '-P', "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=${dest}".toString()]
        }
    }
    buildFeatures {
        compose true
        // BuildConfig 生成を明示 ON（AGP 8.x は既定 OFF）。高負荷スカイ試作トグルを debug ビルド限定で
        // 露出するため BuildConfig.DEBUG を参照する（ADR 0023・release では常に false 扱い）。
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    testOptions {
        unitTests {
            returnDefaultValues true
            // Robolectric + Compose UI テスト（葉 Composable の semantics 検証）に必須。
            // includeAndroidResources=false のままだと Robolectric が merged manifest/リソースを
            // 読めず createComposeRule が起動時に落ちるため。純JVMテスト（PDF/parser 等）には無影響。
            includeAndroidResources true
        }
    }
    sourceSets {
        // Room の schemaLocation 出力（git 管理済み JSON）を androidTest から MigrationTestHelper で
        // 読めるようにする。過去版スキーマを assets として同梱しないと migration テストが書けない。
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        // 大PDF取込ベンチ（PdfImportBenchmark）が assets から実PDF を読むための追加 srcDir。
        // benchmark variant にのみ適用＝debug/release の出荷 APK には一切載らない。
        // TaskProvider をそのまま渡す＝srcDir の実体（Copy の出力）に暗黙のタスク依存が付き、
        // merge だけでなく lint 系など「この assets を読む全タスク」へ Gradle が依存を自動配線する
        // （dir だけ渡して merge に手動 dependsOn する方式は lintVitalAnalyzeBenchmark 等の
        //  implicit_dependency 検証エラーになることを実測＝手動配線の網羅は原理的に漏れる）。
        benchmark.assets.srcDir(copyBenchmarkPdfAsset)
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Room スキーマ JSON の出力先（git 管理対象: android/app/schemas/）
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // なぜ明示 1.4.1: 推移解決の 1.3.1 は SDK 分岐が閉じた switch（〜34）で、Android 16(SDK 36) 実機だと
    // ベースラインプロファイル注入が RESULT_UNSUPPORTED_ART_VERSION になり Macrobenchmark
    // （CompilationMode.DEFAULT）が走れない。1.4.1 は SDK>=31 を上限なしで V015_S 扱い（bytecode 検分済み）
    // かつ minCompileSdk=34 なので現構成（compileSdk 36）でもそのまま解決できる。実利用でも初回起動のプロファイル注入が直る。
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    // Perfetto トレース区間（androidx.tracing.trace）。取込パイプラインのフェーズを Macrobenchmark の
    // TraceSectionMetric で計測するために使う（挿入は Sections ラッパー経由＝JVM 単体テストは no-op で巻き込まない）。
    // なぜ 1.2.0 のまま: 旧 compileSdk 34 天井起因の固定。compileSdk 36 化済み（2026-07-29）で天井は外れたが、
    // 1.3+ へのバンプは動作検証と別便で行う。挿入コード自体は main（全 variant）に入るが android.os.Trace 可用性判定で
    // 実機のみ発行され、出荷挙動は不変（トレース捕捉が無ければネイティブ側で軽い no-op）。
    implementation 'androidx.tracing:tracing-ktx:1.2.0'
    // JankStats: 実利用でのフレーム落ちを画面別に自己計測する（com.novelreader.diagnostics）。
    // なぜ Macrobenchmark と別に要るか: Macrobenchmark は「手元で決まった操作を測って予算を守る」回帰装置で、
    // 実機を日常使いしてもらったときにどの画面が落ちるかは測れない。JankStats は実行中のアプリ自身が
    // フレーム時間を拾うため、手元で再現できない体感ジャンク（2026-07-24 報告）に実測で当たれる。
    // なぜ 1.0.0-beta02: 本ライブラリの安定版は未リリースで beta が実質の最新系列。API は
    // createAndTrack + PerformanceMetricsState の2点のみで、収集を止めれば影響も消える薄い依存。
    implementation 'androidx.metrics:metrics-performance:1.0.0-beta02'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    // U1 新着話チェックの定期実行（24h 周期・ネットワーク制約）。2.9.1 固定は旧 compileSdk 34 天井の名残
    // （compileSdk 36 化済み＝2.10+ も解決可能になったが、バンプは動作検証と別便で行う。2026-07-29）。
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // collectAsStateWithLifecycle 提供。ライフサイクル STOPPED 以下で StateFlow の collect を止め、
    // バックグラウンドでの無駄な購読/再コンポーズを避ける（従来の collectAsState は常時 collect）。
    // なぜ 2.6.2 固定: lifecycle-runtime-ktx と版を揃える。2.8.x を阻んでいた旧 compileSdk 34 天井は
    // 36 化（2026-07-29）で外れたが、バンプは動作検証と別便で行う。
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    // ProcessLifecycleOwner 提供（アプリ全体の前面/背面判定）。変換完了通知の二重報告抑止に使う
    // （UX監査 notify §86）。版は他の lifecycle 群と揃える（2.6.2 固定＝旧 compileSdk 34 天井の名残。36 化済みだがバンプは別便）。
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    // なぜ 2025.02.00: 案B（削除時の詰め直しアニメ復活）に必要な Modifier.animateItem() が
    // foundation 1.7.0+ のため。1.7 系の最終パッチ(1.7.8/material3 1.3.1)を採り、
    // 1.8 系(BOM 2025.04+)を阻んでいた旧 compileSdk 34 天井は 36 化（2026-07-29）で外れたが、BOM バンプは動作検証と別便で行う。
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // HTMLパーサー (Jsoup)
    implementation 'org.jsoup:jsoup:1.17.2'

    // なぜ: List<TextSegment> は Compose stability 推論で不安定→読書 LazyColumn の項目が skippable にならないため（strong skipping 無効の Kotlin 1.9 環境）
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'

    // PDF抽出 (PDFBox-Android / Tom Roush 版)。旧 Chaquopy(Python+pdfminer) から移植した唯一の抽出経路。
    // なぜ 2.0.x 系で固定: Android 版 PDFBox-Android は upstream apache-pdfbox 2.0.x をベースにしており、
    // 移植元プロト (ab-review/submission-B) が apache 2.0.31 で精度検証済みのため API を 1:1 に保てる。
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // データベース (Room)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // なろう公式API ディスカバリ (メタデータ取得のみ・本文は扱わない)。HTTP=Retrofit/OkHttp, JSON=Moshi codegen。
    // なぜ Moshi codegen: 既存の Room 用 KSP に相乗りでき settings.gradle 変更不要。かつ moshi-kotlin(リフレクション版)を
    // 避けることで kotlin-reflect(約3MB) の混入を防ぐ。R8 収縮を有効化した現在もこの選択は有効——
    // リフレクション版は kotlin-reflect ごと広範な keep が必要になり収縮効果を殺すのに対し、
    // codegen は proguard-rules.pro の生成アダプタ keep 2行で済む（Class.forName 解決のため keep 必須）。
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // User-Agent インターセプタ用に版を明示固定

    // 検索履歴＋ピン留め（発見機能 D1）のローカル永続。蔵書 Room を汚さない軽量ストア。
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Custom Tabs（外部Web導線＝なろう作品/話ページをアプリ内オーバーレイ表示）。
    // なぜ WebView ではなく Custom Tabs か: 「アプリで完結」方針を、WebView の保守負担・
    // 規約リスク（本アプリは意図的に WebView を捨ててネイティブ化した経緯がある）を負わずに満たすため。
    // launchUrl の暗黙 ACTION_VIEW のみ使用しサービスバインドはしないため <queries> 追加は不要。
    implementation 'androidx.browser:browser:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.10'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    // 葉 Composable の UI テストを JVM（Robolectric）で回すための基盤（ADR 0009）。
    // なぜ androidTest ではなく Robolectric か: 実機不要で testDebugUnitTest ゲートに同乗でき、
    // ColorOS の freeze/kill 問題（task_diary #36-38）を避けられるため。
    // 版固定 4.11.1（targetSdk 36 化後も据え置ける根拠）: 本プロジェクトの Robolectric テストは全ファイルが
    // @Config(sdk = [34]) で実行時 SDK を明示固定しており、既定の「merged manifest の targetSdk を使う」経路に
    // 乗らない＝targetSdk 36 化しても 4.11.1 のサポート上限（SDK 34）を超えない。
    // 裏返しの制約: JVM テストは SDK 34 の挙動しか見ない。targetSdk 35/36 固有の実行時変化（edge-to-edge 強制など）は
    // ここでは絶対に捕まらず実機検証が要る。SDK 35+ を JVM で見たくなった時点で Robolectric 側のバンプが先に必要。
    testImplementation 'org.robolectric:robolectric:4.11.1'
    // Retrofit の実 URL エンコード（日本語 word の percent-encoding・of/order 等）を実リクエストで検証するため。
    // 版は okhttp 4.12.0 と同系で固定（MockWebServer は OkHttp 同梱物）。
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // BOM 管理下なので ui-test の版指定は不要（compose-bom 2025.02.00 が解決）。
    testImplementation platform('androidx.compose:compose-bom:2025.02.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // createComposeRule が起動する ComponentActivity の宣言を unit test の manifest に供給する。
    // debugImplementation 側にも在るが、testDebugUnitTest のクラスパスへ確実に載せるため明示追加。
    testImplementation 'androidx.compose.ui:ui-test-manifest'
    // Roborazzi スクリーンショットテスト（ADR 0009 増補1）。版は Roborazzi プラグインと一致させる（1.30.1）。
    // roborazzi=キャプチャ/比較の中核、roborazzi-compose=onRoot().captureRoboImage 等 Compose 拡張、
    // roborazzi-junit-rule=RoborazziRule（本実装では未使用だが将来の自動命名運用に備え依存だけ入れる）。
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.30.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.30.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.30.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Room migration の実機検証（MigrationTestHelper）。identity hash 起因の起動即クラッシュを
    // 2度実測したプロジェクトのため（task_diary #39）、「実機で踏む」を「テストで捕まえる」に変える。
    androidTestImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}