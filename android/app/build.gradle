plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.novelreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.novelreader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // Compose compiler の stability/skippability レポート出力。
        // なぜオプトイン(-PcomposeCompilerReports=true): 常時出力はビルド時間を無駄に増やすため、
        // skippable 化の機械検証をしたいときだけ有効化する（従来は検証手段ゼロだった）。
        // layout.buildDirectory 経由なので canonical ビルドの ext4 退避 buildDir にも追従する。
        if (project.findProperty('composeCompilerReports') == 'true') {
            def dest = project.layout.buildDirectory.dir('compose_compiler').get().asFile.absolutePath
            freeCompilerArgs += ['-P', "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=${dest}".toString(),
                                 '-P', "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=${dest}".toString()]
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    testOptions {
        unitTests {
            returnDefaultValues true
        }
    }
    sourceSets {
        // Room の schemaLocation 出力（git 管理済み JSON）を androidTest から MigrationTestHelper で
        // 読めるようにする。過去版スキーマを assets として同梱しないと migration テストが書けない。
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Room スキーマ JSON の出力先（git 管理対象: android/app/schemas/）
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    // collectAsStateWithLifecycle 提供。ライフサイクル STOPPED 以下で StateFlow の collect を止め、
    // バックグラウンドでの無駄な購読/再コンポーズを避ける（従来の collectAsState は常時 collect）。
    // なぜ 2.6.2 固定: lifecycle-runtime-ktx と版を揃える。かつ compileSdk 34 制約下では 2.7+ を避ける
    // （2.8.x は compileSdk 35 前提で本プロジェクトでは解決できないため）。
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    // なぜ 2025.02.00: 案B（削除時の詰め直しアニメ復活）に必要な Modifier.animateItem() が
    // foundation 1.7.0+ のため。1.7 系の最終パッチ(1.7.8/material3 1.3.1)を採り、
    // 1.8 系(BOM 2025.04+)は compileSdk 35 必須のため compileSdk 34 の本プロジェクトでは不可。
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // HTMLパーサー (Jsoup)
    implementation 'org.jsoup:jsoup:1.17.2'

    // なぜ: List<TextSegment> は Compose stability 推論で不安定→読書 LazyColumn の項目が skippable にならないため（strong skipping 無効の Kotlin 1.9 環境）
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'

    // PDF抽出 (PDFBox-Android / Tom Roush 版)。旧 Chaquopy(Python+pdfminer) から移植した唯一の抽出経路。
    // なぜ 2.0.x 系で固定: Android 版 PDFBox-Android は upstream apache-pdfbox 2.0.x をベースにしており、
    // 移植元プロト (ab-review/submission-B) が apache 2.0.31 で精度検証済みのため API を 1:1 に保てる。
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // データベース (Room)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // なろう公式API ディスカバリ (メタデータ取得のみ・本文は扱わない)。HTTP=Retrofit/OkHttp, JSON=Moshi codegen。
    // なぜ Moshi codegen: 既存の Room 用 KSP に相乗りでき settings.gradle 変更不要。かつ moshi-kotlin(リフレクション版)を
    // 避けることで kotlin-reflect(約3MB) の混入を防ぐ。minifyEnabled=false で R8 収縮が効かない本プロジェクトでは
    // 追加 dep がそのまま APK に乗るため、reflect 回避が APK サイズ維持に直結する。
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // User-Agent インターセプタ用に版を明示固定

    // 検索履歴＋ピン留め（発見機能 D1）のローカル永続。蔵書 Room を汚さない軽量ストア。
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Custom Tabs（外部Web導線＝なろう作品/話ページをアプリ内オーバーレイ表示）。
    // なぜ WebView ではなく Custom Tabs か: 「アプリで完結」方針を、WebView の保守負担・
    // 規約リスク（本アプリは意図的に WebView を捨ててネイティブ化した経緯がある）を負わずに満たすため。
    // launchUrl の暗黙 ACTION_VIEW のみ使用しサービスバインドはしないため <queries> 追加は不要。
    implementation 'androidx.browser:browser:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.10'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Room migration の実機検証（MigrationTestHelper）。identity hash 起因の起動即クラッシュを
    // 2度実測したプロジェクトのため（task_diary #39）、「実機で踏む」を「テストで捕まえる」に変える。
    androidTestImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}