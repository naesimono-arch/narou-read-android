plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.novelreader.macrobenchmark'
    // :app の compileSdk 35 化（2026-07-27 裁定）に追従（targetSdk 34 は据え置き＝計測対象の実行時挙動は不変）
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        // 計測対象アプリ(:app)の benchmark タイプと突き合わせる専用タイプ。
        // テストAPK自体は計測対象プロセスではないため debuggable で問題ない
        benchmark {
            debuggable = true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    targetProjectPath ':app'
    // com.android.test モジュールを自己計装（別テストAPK不要）で動かす AGP 標準指定
    experimentalProperties["android.experimental.self-instrumenting"] = true
}

dependencies {
    implementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    // なぜ 1.4.1: 1.3.4 は Android 16(SDK 36) 実機でトレース開始がハング
    // （perfetto --background-wait が stdin 設定待ちのまま永久待機・CPU 0 を実測）。
    // 1.4.1 は Android 16 世代の安定版で minCompileSdk=34/minAGP=8.1.1＝現構成にそのまま入る
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.4.1'
}

androidComponents {
    // benchmark 以外の variant は計測に無意味なため生成自体を止める（公式テンプレート踏襲）
    beforeVariants(selector().all()) { variant ->
        variant.enable = variant.buildType == 'benchmark'
    }
}
