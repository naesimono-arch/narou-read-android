org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── ビルド高速化（2026-07-27 追加。Gradle 8.11.1 / AGP 8.9.1 / Kotlin 1.9.22 は全て対応済み）──
# タスク出力キャッシュ: 入力が同じタスクの再実行を出力再利用で省く（クリーン後・worktree 間でも効く）
org.gradle.caching=true
# 構成フェーズの結果を再利用して起動を短縮（canonical の --init-script も CC の入力として追跡される＝redirect は焼き込まれ、init 変更時は自動で再構成）
org.gradle.configuration-cache=true
# app / macrobenchmark の独立タスクを並列実行する
org.gradle.parallel=true
# Kotlin 増分コンパイル: 変更ファイルのみ再コンパイル（現行版の既定値だが、版更新で既定が揺れても効くよう明示固定）
kotlin.incremental=true
