// Baseline Profile の「生成側（producer）」モジュール。
// なぜ :macrobenchmark に相乗りせず別モジュールにするか:
//   :macrobenchmark は androidComponents の beforeVariants で benchmark 以外の variant を
//   全て無効化しており（予算判定ベンチ専用の構成）、baselineprofile プラグインが要求する
//   nonMinifiedRelease variant が生成できない。相乗りさせるにはその filter を緩める必要があり、
//   既存ベンチ5本ぶんの variant が増殖して計測構成の前提（benchmark buildType 単独）が崩れる。
//   producer を分ければ既存ベンチの構成を一切触らずに済む。
plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.novelreader.baselineprofile'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Baseline Profile の生成は AOT 情報を集めるため API 28+ の端末/AVD が要る
        // （プラグイン側の要求。minSdk 26 の :app 本体とは別条件）。
        minSdk 28
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    targetProjectPath ':app'
}

dependencies {
    implementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    // 版は :macrobenchmark と揃える（Android 16 実機でのトレース開始ハング回避＝同モジュールのコメント参照）
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.4.1'
}

// 生成を走らせる端末の指定。
// ⚠️ useConnectedDevices = true は「接続中の**全端末**へ nonMinifiedRelease を撒く」意味になる。
//    ANDROID_SERIAL を指定せずに :app:generateReleaseBaselineProfile を回すと、実蔵書 7 冊のある
//    実機 PGEM10 にも撒かれる（別 applicationId なので蔵書自体は無傷だが、撒かれること自体が事故）。
//    ⇒ 付け忘れは下のガードが構成段階で止める（人手の作法に頼らない）。
baselineProfile {
    // 生成した profile を :app の src/<variant>/generated/baselineProfiles/ へ書き戻す
    useConnectedDevices = true
}

// ── ANDROID_SERIAL 未指定のまま端末へ撒くのを機械で止めるガード ────────────────────────
//
// なぜ env を whenReady の中ではなく**トップレベル**で解決するか（configuration cache 対策・ここが肝）:
//   ANDROID_SERIAL を実際に使う AGP 側（DeviceProviderInstrumentTestTask）は **タスク実行時**に
//   System.getenv("ANDROID_SERIAL") を読む（AGP 8.10.1 のバイトコードで確認）＝この変数は構成キャッシュの
//   入力として登録されない。そのため「serial 付きで一度成功 → 次は serial 無しで再実行」すると構成キャッシュが
//   ヒットして構成段階が丸ごと飛び、env の参照を whenReady の中だけに置くと**一度も発火しないまま全端末へ撒かれる**。
//   providers.environmentVariable() をここで解決しておけば env が構成キャッシュの入力になり、値が変われば
//   キャッシュが破棄されて構成＝ガードが必ずやり直される（AGP 側が実行時読みである穴も同時に塞がる）。
def androidSerial = providers.environmentVariable('ANDROID_SERIAL').orNull
// AGP は ANDROID_DEVICE_SERIAL を読まない（8.10.1 の全クラスを走査して該当 0 件・ANDROID_SERIAL は 5 クラス）。
// ＝これを「指定済み」と認めると素通りして撒かれるので、合格条件には使わず取り違えたときの助言にだけ使う。
def androidDeviceSerial = providers.environmentVariable('ANDROID_DEVICE_SERIAL').orNull

// なぜ taskGraph.whenReady か: 構成段階で無条件に判定すると assembleDebug も testDebugUnitTest も巻き添えで
//   落ちる。実際に組まれたタスクグラフを見て「端末へ撒くタスクが入っているときだけ」落とす。whenReady は
//   構成の最後（＝構成キャッシュ保存前）に走り、AGP 8.10.1 自身も AndroidTestTaskManager 等 7 クラスで
//   使っている＝構成キャッシュと両立する。
gradle.taskGraph.whenReady { graph ->
    // 撒く実体は producer 側の connected<Variant>AndroidTest（AGP の DeviceProviderInstrumentTestTask）。
    // baselineprofile プラグイン 1.4.1 はタスク名を camelCase(デバイス名, variantName, "androidTest") で組み、
    // 接続端末のデバイス名は固定文字列 "connected"（同プラグインのバイトコードで確認）＝この接頭辞で同定できる。
    // なぜ入口の :app:generate*BaselineProfile を条件にしないか: Managed Device へ移行するとデバイス名が
    //   AVD 名に変わって connected* が消え、ANDROID_SERIAL 自体が不要になる。入口タスク名で見ているとその時に
    //   ガードだけが残って誤って止めてしまう。「撒く実体」で見れば移行時に自動で外れる。
    // task.project でなく task.path（String）で判定する＝構成キャッシュが嫌う Project 参照を持ち込まない。
    def spreadingTasks = graph.allTasks*.path.findAll { it.startsWith(':baselineprofile:connected') }
    if (spreadingTasks.isEmpty()) return
    if (androidSerial?.trim()) return

    def hint = ''
    if (androidDeviceSerial?.trim()) {
        hint = '\n  ※ ANDROID_DEVICE_SERIAL が設定されていますが、AGP はこの変数を読みません' +
            '（読むのは ANDROID_SERIAL のみ）＝端末の指定としては無効です。\n'
    }
    throw new GradleException(
        'Baseline Profile の生成を止めました: 環境変数 ANDROID_SERIAL が未設定です。\n' +
        '\n' +
        '【なぜ止めたか】\n' +
        '  この producer は useConnectedDevices = true で動くため、対象端末を指定しないと\n' +
        '  adb に接続中の全端末へ nonMinifiedRelease APK を install して実行します。\n' +
        '  実蔵書の入った実機まで巻き込む事故になるので、撒く前に構成段階で止めました。\n' +
        hint +
        '\n' +
        '【どうすればよいか】\n' +
        '  1) 対象端末の serial を確認する:\n' +
        '       adb devices\n' +
        '  2) serial を指定して実行する:\n' +
        '       ANDROID_SERIAL=<serial> ./gradlew :app:generateReleaseBaselineProfile\n' +
        '\n' +
        '  止めたタスク: ' + spreadingTasks.join(', ') + '\n'
    )
}

// 計測対象の applicationId を instrumentation 引数 targetAppId としてテスト側へ渡す。
//
// ⚠️ これは baselineprofile プラグインが自動でやってくれると誤解しやすいが**やらない**（1.4.1 で実測＝
// 入れずに generateReleaseBaselineProfile を回すと targetAppId が null で生成テストが落ちる）。
//
// ⚠️ そして値の出所に variant.testedApplicationId を使ってはいけない（2026-09-02 に実測で確認）。
// producer モジュールはプラグインによって **self-instrumenting**（テストAPK単体で動く形）に設定されるため、
// 「テスト対象パッケージ」はモジュール自身＝testedApplicationId も targetContext も
// "com.novelreader.baselineprofile" を返す。これを targetAppId として渡すと macrobenchmark は
// **テストプロセス自身を計測対象とみなして force-stop** し、instrumentation が実行 0.7 秒で死ぬ。
// Gradle 側に出るのは "Process crashed." だけで Java 例外もログも残らない＝原因がまったく読めない。
// 正しい出所は「実際にビルドされた対象APK のメタデータ」＝testedApks を BuiltArtifactsLoader で読む。
// これは applicationIdSuffix 等の buildType 側の加工も反映した最終値になる。
androidComponents {
    onVariants(selector().all()) { variant ->
        def artifactsLoader = variant.artifacts.getBuiltArtifactsLoader()
        variant.instrumentationRunnerArguments.put(
            'targetAppId',
            variant.testedApks.map { artifactsLoader.load(it)?.applicationId },
        )
    }
}
