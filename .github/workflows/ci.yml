# CI: 端末を要さないゲート（JVM 実行とビルド）を回す。「実機での実行」が要るものだけが対象外。
#
# 対象外とその理由:
# - androidTest の**実行**（app/src/androidTest: PdfPipelineDeviceTest・MigrationTest・NativeReadingScreenTest 等）:
#   接続端末が必須（connectedAndroidTest）。本プロジェクトでは実機 OPPO での /device-verify 運用が正で、
#   エミュレータ CI 化は未整備（connectedAndroidTest 直叩きは蔵書DB消失の禁忌もある＝CLAUDE.md）。
#   ただし**ビルドは端末不要**なので assembleDebugAndroidTest としてゲートへ載せてある（下記ステップ）。
#   実行だけが対象外＝この区別が本ワークフローの元々の意図（「実機必須のもの」＝実行）。
# - :macrobenchmark: com.android.test モジュールで実機計測専用＝runner では実行不能。
#
# 旧「対象外」判断の撤回（2026-07-30・verifyRoborazziDebug を対象へ編入）:
#   旧理由は「JVM のフォントレンダリングは環境依存＝GitHub runner のフォント環境では偽赤が出る」だったが、
#   実測でこの前提が誤りと確定した。Robolectric はフォントをホストから取らず、AOSP のフォント一式を
#   nativeruntime-dist-compat（版は 1.0.2 に固定）へ同梱し一時ディレクトリへ展開して使う
#   （DroidSansFallback.ttf 等＝CJK も同梱）。裏取り: 記録機（WSL）の fontconfig には日本語フォントが
#   1本も無い（fc-list :lang=ja が 0件）のに golden の日本語グリフは正しく出ている＝ホスト非依存の証拠。
#   描画は Robolectric 4.11.1 ＋ 全 Screenshot*Test の @Config(sdk=[34]) ＋ linux-x86_64 の同一 .so で固定され、
#   ubuntu runner も WSL も同じ組合せになる。ADR 0009 増補1 の「golden は WSL(Linux) 記録が正」は
#   OS 差（Windows 記録の排除）を言ったもので、Linux runner とは衝突しない。
#   ※ 万一 runner 側で環境差の偽赤が出た場合、正しい対処は閾値で黙らせることではなく
#     「記録機を runner に一本化する」か本ステップを戻すこと（差分画像は build/outputs/roborazzi に出る）。
name: CI

on:
  push:
  pull_request:

# 同一 ref への連続 push で古い実行をキャンセル（最新コミットの結果だけが要る）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # 45→60: androidTest ビルドと release(R8) ビルドを足した分の余裕（cold runner は
    # キャッシュ不発時に全 variant をコンパイルする）。走行時間そのものは Actions の実測で見る。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # デザイントークン検査を最初に回す（純 Python・数秒＝最速で drift を検知して fail-fast）。
      # ubuntu-latest 同梱の python3（stdlib のみ使用）で足りるため setup-python は不要。
      - name: Design token check
        run: python3 tools/check_design_tokens.py

      # scrape 目次の章数を、パーサ実装を通さずに fixture の HTML から数え直して
      # *GoldenTest.kt が主張する期待値と突き合わせる（暁66・カクヨム593）。
      # なぜ CI ジョブで、単体テストに入れないのか:
      # ①独立性が結線の目的そのもの。突合の相手方は *GoldenTest.kt に書かれた**リテラル**であって
      #   「66」という値ではない。JVM テスト側へ期待値を書き写すと、実装が壊れたときに
      #   golden の 66 を 65 へ直す退行が新テストも一緒に素通りする（両方直せば緑）＝第二の目が消える。
      #   ソース文面を読む検査は、テスト実行系の外に置いてこそ系譜の外側に居られる。
      # ②失敗の読み: 落ちれば「暁が 66 でなく 65 章になった」と1行で出る。単体テスト群に混ぜると
      #   何百件の中の1 failure になり、実装の赤か fixture の赤かが分からなくなる。
      # ③頻度: push/PR ごと＝実装変更でも fixture 差し替えでも必ず走る（Gradle の UP-TO-DATE で
      #   飛ばされることもない。verifyRoborazziDebug の「既知の限界」と同じ罠を踏まない）。
      # 走行は純 bash（grep/sort/wc）で数十 ms＝Java セットアップより前に置いて fail-fast を保つ。
      - name: TOC 章数の実装非依存突合（暁66・カクヨム593）
        run: bash tools/count_toc_fixture_chapters.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # AGP の要求 JDK に追随（AGP の版の正本＝android/settings.gradle）。ローカルの Temurin 17 と同一系列

      # Gradle のビルドキャッシュ・wrapper キャッシュを跨ぎ実行で共有
      - uses: gradle/actions/setup-gradle@v4

      # gradlew は git index が 100644（実行ビット無し）のため checkout 直後は Permission denied になる。
      # 改行は LF（file コマンドで確認済み）なので CRLF 変換の前処理は不要＝chmod のみ。
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ktlint: 未使用 import の機械検知（2026-07-30 追加）。
      # なぜ要るのか: 導入前は ktlint/detekt/spotless のいずれも無く、Android Lint は未使用 import を
      # 既定で拾わない（かつ warnings は非ブロック）ため、87件/34ファイル まで無検知で溜まっていた。
      # 対象ルールは .editorconfig で no-unused-imports 1本に絞ってある（理由は同ファイル）。
      # なぜコンパイル系より前か: ktlint はソースを構文解析するだけでコンパイルを要さない＝最も安いので、
      # 既存ステップの「安い順に落とす fail-fast」方針に合わせてこの位置に置く。
      #
      # 2026-08-05 にブロッキングへ復帰（導入時の既存違反 87件 の残り 41件＝debug 2・main 30・test 9 を
      # 本便で除き切った）。導入時に暫定で置いていた continue-on-error: true は、残したままだと
      # 「検知しているのに落ちない」＝導入した意味が消えるため、掃除と同じ便で外すと決めてあった。
      # ⚠️ 手元で残数を数えるときは `./gradlew --continue :app:ktlintCheck` を使う——
      # --continue 無しだと最初に落ちたソースセットで止まり、他のソースセットの report が
      # 生成されないまま「あと N 件」と読み違える（本便の着手時に実際そうなった＝台帳の「2件」は debug の分だけだった）。
      - name: ktlint (未使用 import 検知)
        working-directory: android
        run: ./gradlew :app:ktlintCheck

      # 単体テスト（Robolectric semantics/スクリーンショット系・PDF 抽出 golden 回帰
      # 〔JvmGoldenRegressionTest: 参照する sample_pdfs/ と ab-review/golden_regression/ は
      # git 追跡済み＝checkout だけで揃う〕を含む）＋ スクリーンショット golden の画像比較。
      # Android SDK は runner 同梱（ANDROID_HOME 設定済み・ライセンス承諾済み）を利用し、
      # 不足コンポーネントは AGP が自動取得する。
      #
      # なぜ testDebugUnitTest ではなく verifyRoborazziDebug を回すのか:
      # verify は testDebugUnitTest 本体を roborazzi.test.verify=true 付きで実行する形なので、
      # 単体テスト全件と golden 比較の全枚数が**同じ1パス**で終わる（件数・枚数は増えるので書かない＝タスク出力で確認）。
      # 2ステップに分けると system property が変わって test タスクが丸ごと2回走り、時間がほぼ倍になる。
      # golden 不一致は captureRoboImage が AssertionError を投げてテストを落とす＝ビルドが赤になる
      # （golden 1枚を差し替えた陽性確認で BUILD FAILED を実測済み）。
      # 旧ステップの無修飾 testDebugUnitTest（全サブプロジェクト対象）から :app: 修飾に変わるが、
      # :macrobenchmark は src/main しか持たず unit test の source set が無いので実行対象は減らない。
      #
      # 既知の限界: golden PNG は test タスクの宣言済み入力ではないため、golden **だけ**を差し替えた変更は
      # UP-TO-DATE / FROM-CACHE で素通りしうる（ローカル warm で実測）。本ステップが塞ぐのは
      # 「実装が動いて golden が取り残される」向きで、そちらは実装変更が test タスクの入力を変えるため必ず再実行される。
      - name: Unit tests + screenshot golden verify
        working-directory: android
        run: ./gradlew :app:verifyRoborazziDebug

      # golden の fontScale 2.0 破綻を画素から走査する（純 Python・標準ライブラリのみ）。
      # なぜ verify と別に要るか: verify は「撮った1枚 → 同名 golden」の一致しか見ないため、
      # **初回記録の時点で壊れていた絵**は永久に正として固定される。実際 2026-08-06 の監査で
      # 104枚中20枚が破綻を焼き付けており、CI は全期間ずっと緑だった。
      #
      # 2026-08-17 にブロッキングへ昇格（continue-on-error: true を外した）。
      # 経緯（なぜ最初から落とさなかったか）: 導入した 2026-08-06 時点で (c) が1件赤く、これは目次の
      # 「ここから再開」チップが**非加重子として実寸を先取り**して章題を1行1文字へ潰す実破綻だった
      # （K/M/J。M/J は話数ラベル `.ep` の 52dp 固定でラベル自体も3行に割れており、こちらは (c) の
      # 行内孤立条件に掛からず無検知だった）。是正が意匠変更を伴いモック裁定待ちだったため、
      # 二段構えの第1段＝可視化だけを先に置いて赤を溜めない形にした。
      # 解消: 2026-08-07 の「目次の現在地バーが fontScale 2.0 で章題を1行1文字に潰し進捗も読めない」の
      # 修正便で K/M/J/D/P の5経路とも是正され（チップのアイコン化＋話数ラベル幅を
      # 桁数追従へ＝ui/skins/TocEpLabelWidth.kt。52dp は固定幅ではなく下限になった）、走査3本とも赤0になった。
      # レイアウト値の回帰は test/.../TocResumeAffordanceLayoutTest.kt が別途固定している。
      # 昇格の条件は導入時から「赤0になったら外す」と決めてあった＝ktlint が 2026-08-05 に辿ったのと同じ経路。
      # ⚠️ 3本は1つの run にぶら下がるが、既定シェルが `bash -e` なので**最初に落ちた1本で止まる**。
      # 手元で全件の残数を数えるときは3本を個別に叩くこと（ktlint の --continue と同じ落とし穴）。
      # 走査(c) の判定器そのものの回帰（感度＝本物を赤にする／特異度＝産物を緑にする）。
      # なぜ走査より先に置くか: 偽陽性を消すたびに述語が足される検査なので、緩めすぎて
      # 「常に緑を返すだけの部品」に化けても走査本体は緑のままで気づけない。走査の結果を
      # 信じる前に、判定器が是正済みの本物（履歴から凍結した golden）を今も赤にできることを見る。
      - name: golden 走査(c) 判定器の回帰テスト
        run: python3 tools/test_check_golden_label_split.py

      - name: golden の 2.0 破綻走査（ブロッキング）
        run: |
          python3 tools/check_golden_rule_loss.py android/app/src/test/screenshots
          python3 tools/check_golden_bottom_clip.py android/app/src/test/screenshots
          python3 tools/check_golden_label_split.py android/app/src/test/screenshots

      # androidTest の「ビルドだけ」をゲートへ（実行は端末必須＝冒頭コメント）。
      # なぜ必要か: 既定ゲートの testDebugUnitTest は androidTest ソースをコンパイルしないため、
      # 本番のシグネチャ変更に追従しないまま壊れて潜伏する（実際に2回発生＝docs/known-bugs-registry.md の
      # androidtest-not-compiled-by-default-gate）。
      # なぜ compileDebugAndroidTestKotlin ではなく assembleDebugAndroidTest か: Kotlin コンパイルに加えて
      # マニフェスト結合・リソース結合・dex 化まで通り、androidTest 専用依存の欠落も捕まえられる。
      # 追加コストは実測でわずか（compile まで 26s → assemble まで 35s）で、強い方を選ばない理由がない。
      # 直前の単体テストと debug variant のコンパイル成果物を共有するのでこの位置に置く。
      - name: Build androidTest (ビルドのみ・端末不要)
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest

      # Lint: errors=0 がゲート（AGP 既定の abortOnError=true で errors があれば失敗）。
      # warnings は既定で非ブロック＝件数の増減では落ちない。
      - name: Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      # release だけビルド不能になる型を捕まえる（R8 が新依存の未知属性で落ちる等。実際に In-App Review
      # 導入で停止＝docs/known-bugs-registry.md の release-r8-only-build-break）。debug は通るので
      # 他のどのステップでも代替できない。
      # なぜ最後か: 実測で最も重く（ローカル warm で 2m10s。R8 収縮＋リソース収縮＋lintVitalRelease を含む）、
      # かつ唯一 release variant を丸ごとコンパイルするため。安い順に落とす fail-fast を保つ。
      # 署名鍵は不要: app/build.gradle は local.properties に鍵が無ければ signingConfig を組まず
      # 未署名で通す設計（鍵の無い worktree で実測）。本ステップの目的は R8 起因のビルド破綻の検知であって
      # 署名の検証ではないので、CI に鍵を置く必要はない。
      - name: Release build (R8)
        working-directory: android
        run: ./gradlew :app:assembleRelease
